function ShiftScheduler({token, toast, venueId}) {
  const [shifts, setShifts] = useState([]);
  const [staff, setStaff] = useState([]);
  const [schedule, setSchedule] = useState({days:[], assignments:[]});
  const [weekStart, setWeekStart] = useState(() => {
    const d = new Date();
    d.setDate(d.getDate() - d.getDay() + 1);
    return d.toISOString().slice(0,10);
  });
  const [modal, setModal] = useState(false);
  const [shiftForm, setShiftForm] = useState({name:'', start_time:'09:00', end_time:'17:00', color:'#3b82f6'});
  const [assigning, setAssigning] = useState(null); // {date, staffId}
  const [selShift, setSelShift] = useState('');

  const load = () => {
    api(`/venues/${venueId}/shifts`, {}, token).then(setShifts);
    api(`/venues/${venueId}/schedule?week_start=${weekStart}`, {}, token).then(setSchedule);
    api(`/staff?venue_id=${venueId}`, {}, token).then(setStaff);
  };
  useEffect(() => { load(); }, [weekStart]);

  const prevWeek = () => { const d=new Date(weekStart); d.setDate(d.getDate()-7); setWeekStart(d.toISOString().slice(0,10)); };
  const nextWeek = () => { const d=new Date(weekStart); d.setDate(d.getDate()+7); setWeekStart(d.toISOString().slice(0,10)); };

  const saveShift = async () => {
    try { await api(`/venues/${venueId}/shifts`, {method:'POST', body:JSON.stringify(shiftForm)}, token); toast('Shift created'); setModal(false); load(); }
    catch(e) { toast(e.message, 'error'); }
  };

  const deleteShift = async (id) => {
    if(!confirm('Delete this shift type?')) return;
    await api(`/shifts/${id}`, {method:'DELETE'}, token); toast('Deleted'); load();
  };

  const assign = async (date, staffId, shiftId) => {
    if (!shiftId) return;
    try {
      await api('/schedule/assign', {method:'POST', body:JSON.stringify({assignments:[{shift_id:shiftId, staff_id:staffId, date}]})}, token);
      load();
    } catch(e) { toast(e.message, 'error'); }
  };

  const removeAssignment = async (id) => {
    await api(`/schedule/assign/${id}`, {method:'DELETE'}, token); load();
  };

  const getAssignments = (date, staffId) =>
    schedule.assignments.filter(a => a.date === date && a.staff_id === staffId);

  const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dateObjs = schedule.days.map(d => new Date(d + 'T00:00:00'));
  const today = new Date().toISOString().slice(0,10);

  return (
    <div className="page-wrap">
      <div className="page-head">
        <div><h2>Shift Scheduler</h2><p>Weekly staff schedule</p></div>
        <div className="btn-row">
          <button className="btn btn-ghost btn-sm" onClick={prevWeek}>← Prev</button>
          <span style={{fontSize:'0.8rem',padding:'0 8px',color:'var(--gray)'}}>{schedule.days[0]} — {schedule.days[6]}</span>
          <button className="btn btn-ghost btn-sm" onClick={nextWeek}>Next →</button>
          <button className="btn btn-black" onClick={()=>setModal(true)}>+ Shift Type</button>
        </div>
      </div>

      {/* Shift Types Legend */}
      <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:'0.62rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gray)',marginRight:4}}>Shifts:</span>
        {shifts.map(s=>(
          <div key={s.id} style={{display:'flex',alignItems:'center',gap:6,background:s.color+'20',border:`1px solid ${s.color}`,borderRadius:4,padding:'4px 10px'}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:s.color}}/>
            <span style={{fontSize:'0.72rem',fontWeight:500,color:s.color}}>{s.name}</span>
            <span style={{fontSize:'0.65rem',color:'var(--gray)'}}>{s.start_time}–{s.end_time}</span>
            <button onClick={()=>deleteShift(s.id)} style={{background:'none',border:'none',color:'var(--gray)',cursor:'pointer',fontSize:'0.7rem',padding:'0 2px'}}>×</button>
          </div>
        ))}
        {shifts.length===0 && <span style={{fontSize:'0.75rem',color:'var(--mid-gray)'}}>No shift types yet — create one</span>}
      </div>

      {/* Schedule Grid */}
      <div className="shift-table-wrap" style={{overflowX:'auto',WebkitOverflowScrolling:'touch'}}>
        <table style={{width:'100%',borderCollapse:'collapse',minWidth:700}}>
          <thead>
            <tr>
              <th style={{width:130,textAlign:'left',padding:'10px 12px',fontSize:'0.6rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gray)',background:'var(--off-white)',border:'1px solid var(--light-gray)'}}>Staff</th>
              {schedule.days.map((d,i)=>(
                <th key={d} style={{textAlign:'center',padding:'10px 8px',fontSize:'0.68rem',fontWeight:500,background:d===today?'var(--black)':'var(--off-white)',color:d===today?'var(--white)':'var(--dark-gray)',border:'1px solid var(--light-gray)',minWidth:110}}>
                  {dayLabels[i]}<br/><span style={{fontSize:'0.62rem',opacity:0.7}}>{d.slice(5)}</span>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {staff.filter(s=>s.role!=='super_admin').map(s=>(
              <tr key={s.id}>
                <td style={{padding:'8px 12px',border:'1px solid var(--light-gray)',background:'var(--white)'}}>
                  <div style={{fontWeight:500,fontSize:'0.82rem'}}>{s.name}</div>
                  <span className={`role-badge ${s.role}`} style={{fontSize:'0.55rem'}}>{s.role}</span>
                </td>
                {schedule.days.map(d=>{
                  const asgns = getAssignments(d, s.id);
                  return (
                    <td key={d} style={{padding:'6px 8px',border:'1px solid var(--light-gray)',background:d===today?'#fafff5':'var(--white)',verticalAlign:'top',minHeight:60}}>
                      {asgns.map(a=>(
                        <div key={a.id} style={{background:a.color+'20',border:`1px solid ${a.color}`,borderRadius:4,padding:'3px 6px',marginBottom:4,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <div>
                            <div style={{fontSize:'0.68rem',fontWeight:600,color:a.color}}>{a.shift_name}</div>
                            <div style={{fontSize:'0.6rem',color:'var(--gray)'}}>{a.start_time}–{a.end_time}</div>
                          </div>
                          <button onClick={()=>removeAssignment(a.id)} style={{background:'none',border:'none',color:'var(--gray)',cursor:'pointer',fontSize:'0.75rem',padding:'0 2px',flexShrink:0}}>×</button>
                        </div>
                      ))}
                      {asgns.length < 2 && shifts.length > 0 && (
                        <select
                          style={{width:'100%',fontSize:'0.65rem',padding:'3px 4px',border:'1px dashed var(--mid-gray)',background:'transparent',color:'var(--gray)',cursor:'pointer',borderRadius:4,outline:'none'}}
                          value=""
                          onChange={e=>{ if(e.target.value) assign(d, s.id, e.target.value); e.target.value=''; }}
                        >
                          <option value="">+ Add shift</option>
                          {shifts.map(sh=><option key={sh.id} value={sh.id}>{sh.name} {sh.start_time}–{sh.end_time}</option>)}
                        </select>
                      )}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Weekly summary */}
      <div style={{marginTop:20,display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:12}}>
        {staff.filter(s=>s.role!=='super_admin').map(s=>{
          const myShifts = schedule.assignments.filter(a=>a.staff_id===s.id);
          const totalHours = myShifts.reduce((sum,a)=>{
            try{const[h1,m1]=a.start_time.split(':').map(Number);const[h2,m2]=a.end_time.split(':').map(Number);let h=(h2*60+m2)-(h1*60+m1);if(h<0)h+=24*60;return sum+h/60;}catch{return sum;}
          },0);
          return (
            <div key={s.id} className="stat-card">
              <div style={{fontSize:'0.72rem',fontWeight:500,marginBottom:4}}>{s.name}</div>
              <div className="stat-val" style={{fontSize:'1.5rem'}}>{totalHours.toFixed(0)}h</div>
              <div className="stat-lbl">{myShifts.length} shifts this week</div>
            </div>
          );
        })}
      </div>

      {/* Create Shift Type Modal */}
      {modal && <div className="modal-bg"><div className="modal-box" style={{maxWidth:420}}>
        <h3>Create Shift Type</h3>
        <div className="form-grid">
          <div className="form-group full"><label className="f-label">Shift Name *</label><input className="f-input" value={shiftForm.name} onChange={e=>setShiftForm({...shiftForm,name:e.target.value})} placeholder="e.g. Morning, Evening, Night"/></div>
          <div className="form-group"><label className="f-label">Start Time</label><input type="time" className="f-input" value={shiftForm.start_time} onChange={e=>setShiftForm({...shiftForm,start_time:e.target.value})}/></div>
          <div className="form-group"><label className="f-label">End Time</label><input type="time" className="f-input" value={shiftForm.end_time} onChange={e=>setShiftForm({...shiftForm,end_time:e.target.value})}/></div>
          <div className="form-group"><label className="f-label">Color</label><input type="color" className="f-input" value={shiftForm.color} onChange={e=>setShiftForm({...shiftForm,color:e.target.value})} style={{height:40,padding:4}}/></div>
          <div className="form-group" style={{display:'flex',alignItems:'center',gap:10,padding:12,background:shiftForm.color+'15',border:`1px solid ${shiftForm.color}`,borderRadius:4}}>
            <div style={{width:12,height:12,borderRadius:'50%',background:shiftForm.color}}/><span style={{fontSize:'0.8rem',color:shiftForm.color,fontWeight:600}}>{shiftForm.name||'Preview'} {shiftForm.start_time}–{shiftForm.end_time}</span>
          </div>
        </div>
        <div className="modal-footer"><button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancel</button><button className="btn btn-black" onClick={saveShift} disabled={!shiftForm.name}>Create</button></div>
      </div></div>}
    </div>
  );
}


// ══════════════════════════════════════════════
// PHASE 2: RESERVATIONS
// ══════════════════════════════════════════════
function ReservationsManager({token, toast, venueId}) {
  const [reservations, setRes] = useState([]);
  const [modal, setModal] = useState(false);
  const [date, setDate] = useState(new Date().toISOString().slice(0,10));
  const [form, setForm] = useState({customer_name:'',phone:'',email:'',party_size:2,date:'',time:'19:00',duration_mins:90,table_id:'',special_requests:'',status:'confirmed'});
  const [tables, setTables] = useState([]);

  const load = () => {
    api(`/venues/${venueId}/reservations?date=${date}`,{},token).then(setRes).catch(()=>{});
    api(`/venues/${venueId}/tables`,{},token).then(setTables).catch(()=>{});
  };
  useEffect(()=>{ load(); },[date]);

  const save = async() => {
    try {
      await api(`/venues/${venueId}/reservations`,{method:'POST',body:JSON.stringify({...form,date:form.date||date})},token);
      toast('Reservation added'); setModal(false); load();
    } catch(e) { toast(e.message,'error'); }
  };

  const updateStatus = async(id, status) => {
    await api(`/reservations/${id}`,{method:'PUT',body:JSON.stringify({status})},token);
    toast(`Reservation ${status}`); load();
  };

  const statusColor = {confirmed:'var(--green)',pending:'var(--amber)',cancelled:'var(--red)',seated:'var(--blue,#2563eb)',completed:'var(--gray)'};
  const timeSlots = Array.from({length:28},(_,i)=>{ const h=Math.floor(i/2)+10; const m=i%2===0?'00':'30'; return `${String(h).padStart(2,'0')}:${m}`; });

  return (
    <div className="page-wrap">
      <div className="page-head">
        <div><h2>Reservations</h2><p>{reservations.length} bookings for {date}</p></div>
        <div className="btn-row">
          <input type="date" className="f-input" value={date} onChange={e=>setDate(e.target.value)} style={{padding:'7px 12px'}}/>
          <button className="btn btn-black" onClick={()=>setModal(true)}>+ Book Table</button>
        </div>
      </div>

      {/* Timeline view */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12,marginBottom:20}}>
        {reservations.length === 0 ? <div className="empty" style={{gridColumn:'1/-1'}}>No reservations for this date</div> :
        reservations.map(r=>(
          <div key={r.id} style={{background:'var(--white)',border:`2px solid ${statusColor[r.status]||'var(--lg)'}20`,borderLeft:`4px solid ${statusColor[r.status]||'var(--mg)'}`,borderRadius:'var(--r)',padding:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <div>
                <div style={{fontWeight:600,fontSize:'0.9rem'}}>{r.customer_name}</div>
                <div style={{fontSize:'0.7rem',color:'var(--gray)'}}>{r.phone} {r.email&&`· ${r.email}`}</div>
              </div>
              <span className={`status-badge ${r.status}`}>{r.status}</span>
            </div>
            <div style={{display:'flex',gap:16,fontSize:'0.78rem',color:'var(--dark-gray)',marginBottom:10}}>
              <span>🕐 {r.time}</span>
              <span>👥 {r.party_size} guests</span>
              <span>⏱ {r.duration_mins}min</span>
            </div>
            {r.special_requests && <div style={{fontSize:'0.72rem',color:'var(--amber)',background:'#fef3c7',padding:'4px 8px',borderRadius:4,marginBottom:10}}>⚠ {r.special_requests}</div>}
            <div className="btn-row">
              {r.status==='confirmed'&&<button className="btn btn-green btn-xs" onClick={()=>updateStatus(r.id,'seated')}>Seat Now</button>}
              {r.status==='seated'&&<button className="btn btn-ghost btn-xs" onClick={()=>updateStatus(r.id,'completed')}>Complete</button>}
              {['confirmed','pending'].includes(r.status)&&<button className="btn btn-red btn-xs" onClick={()=>updateStatus(r.id,'cancelled')}>Cancel</button>}
            </div>
          </div>
        ))}
      </div>

      {modal && <div className="modal-bg"><div className="modal-box">
        <h3>New Reservation</h3>
        <div className="form-grid">
          <div className="form-group full"><label className="f-label">Guest Name *</label><input className="f-input" value={form.customer_name} onChange={e=>setForm({...form,customer_name:e.target.value})} placeholder="Full name"/></div>
          <div className="form-group"><label className="f-label">Phone</label><input className="f-input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+91 ..."/></div>
          <div className="form-group"><label className="f-label">Email</label><input className="f-input" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="optional"/></div>
          <div className="form-group"><label className="f-label">Date</label><input type="date" className="f-input" value={form.date||date} onChange={e=>setForm({...form,date:e.target.value})}/></div>
          <div className="form-group"><label className="f-label">Time</label>
            <select className="f-select" value={form.time} onChange={e=>setForm({...form,time:e.target.value})}>
              {timeSlots.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="f-label">Party Size</label><input type="number" className="f-input" value={form.party_size} onChange={e=>setForm({...form,party_size:parseInt(e.target.value)||1})} min={1} max={50}/></div>
          <div className="form-group"><label className="f-label">Duration (min)</label>
            <select className="f-select" value={form.duration_mins} onChange={e=>setForm({...form,duration_mins:parseInt(e.target.value)})}>
              {[60,90,120,150,180].map(d=><option key={d} value={d}>{d} min ({d/60}h)</option>)}
            </select>
          </div>
          <div className="form-group"><label className="f-label">Table (optional)</label>
            <select className="f-select" value={form.table_id} onChange={e=>setForm({...form,table_id:e.target.value})}>
              <option value="">Auto-assign</option>
              {tables.map(t=><option key={t.id} value={t.id}>{t.table_number} (cap. {t.capacity})</option>)}
            </select>
          </div>
          <div className="form-group"><label className="f-label">Status</label>
            <select className="f-select" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
              <option value="confirmed">Confirmed</option>
              <option value="pending">Pending</option>
            </select>
          </div>
          <div className="form-group full"><label className="f-label">Special Requests</label><textarea className="f-textarea" value={form.special_requests} onChange={e=>setForm({...form,special_requests:e.target.value})} placeholder="Dietary needs, occasion, seating preferences…"/></div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancel</button>
          <button className="btn btn-black" onClick={save} disabled={!form.customer_name}>Confirm Booking</button>
        </div>
      </div></div>}
    </div>
  );
}

// ══════════════════════════════════════════════
// PHASE 2: INVENTORY MANAGER
// ══════════════════════════════════════════════
function InventoryManager({token, toast, venueId}) {
  const [items, setItems] = useState([]);
  const [modal, setModal] = useState(false);
  const [restockModal, setRestockModal] = useState(null);
  const [restockQty, setRestockQty] = useState('');
  const [tab, setTab] = useState('all');
  const [form, setForm] = useState({name:'',category:'',unit:'kg',current_stock:0,min_stock:0,cost_per_unit:0,supplier:''});
  const cats = ['Vegetables','Dairy','Coffee Beans','Bakery','Meat','Beverages','Spices','Packaging','Cleaning','Other'];

  const load = () => api(`/venues/${venueId}/inventory`,{},token).then(setItems).catch(()=>{});
  useEffect(()=>{ load(); },[]);

  const save = async() => {
    try { await api(`/venues/${venueId}/inventory`,{method:'POST',body:JSON.stringify(form)},token); toast('Item added'); setModal(false); load(); }
    catch(e) { toast(e.message,'error'); }
  };

  const restock = async() => {
    if (!restockQty) return;
    const item = restockModal;
    const newQty = parseFloat(item.current_stock) + parseFloat(restockQty);
    try { await api(`/inventory/${item.id}`,{method:'PUT',body:JSON.stringify({current_stock:newQty})},token); toast(`Restocked ${item.name}`); setRestockModal(null); setRestockQty(''); load(); }
    catch(e) { toast(e.message,'error'); }
  };

  const updateStock = async(id, qty) => {
    await api(`/inventory/${id}`,{method:'PUT',body:JSON.stringify({current_stock:parseFloat(qty)})},token);
    load();
  };

  const lowStock = items.filter(i=>parseFloat(i.current_stock)<=parseFloat(i.min_stock));
  const displayed = tab==='low' ? lowStock : tab==='all' ? items : items.filter(i=>i.category===tab);

  return (
    <div className="page-wrap">
      <div className="page-head">
        <div>
          <h2>Inventory</h2>
          <p>{items.length} items · <span style={{color:'var(--red)',fontWeight:500}}>{lowStock.length} low stock alerts</span></p>
        </div>
        <button className="btn btn-black" onClick={()=>setModal(true)}>+ Add Item</button>
      </div>

      {lowStock.length > 0 && (
        <div className="geo-alert warning" style={{marginBottom:16,borderRadius:'var(--r)'}}>
          ⚠ <strong>{lowStock.length} items</strong> are at or below minimum stock:&nbsp;
          {lowStock.slice(0,3).map(i=>i.name).join(', ')}{lowStock.length>3?` +${lowStock.length-3} more`:''}
        </div>
      )}

      <div className="tab-bar">
        <button className={`tab-btn ${tab==='all'?'active':''}`} onClick={()=>setTab('all')}>All ({items.length})</button>
        <button className={`tab-btn ${tab==='low'?'active':''}`} onClick={()=>setTab('low')} style={tab!=='low'&&lowStock.length>0?{color:'var(--red)'}:{}}>Low Stock ({lowStock.length})</button>
        {[...new Set(items.map(i=>i.category))].filter(Boolean).map(c=>(
          <button key={c} className={`tab-btn ${tab===c?'active':''}`} onClick={()=>setTab(c)}>{c}</button>
        ))}
      </div>

      <div className="tbl-wrap">
        <table className="data-tbl">
          <thead><tr><th>Item</th><th>Category</th><th>Current Stock</th><th>Min Stock</th><th>Unit</th><th>Cost/Unit</th><th>Supplier</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            {displayed.map(item=>{
              const isLow = parseFloat(item.current_stock) <= parseFloat(item.min_stock);
              return (
                <tr key={item.id} style={isLow?{background:'#fff5f5'}:{}}>
                  <td style={{fontWeight:500,color:'var(--black)'}}>{item.name}</td>
                  <td><span className="status-badge">{item.category||'—'}</span></td>
                  <td>
                    <input type="number" step="0.1"
                      style={{width:80,background:isLow?'#fee2e2':'var(--off)',border:`1px solid ${isLow?'var(--red)':'var(--lg)'}`,padding:'4px 8px',fontSize:'0.78rem',borderRadius:4,fontWeight:isLow?700:400}}
                      defaultValue={item.current_stock}
                      onBlur={e=>updateStock(item.id,e.target.value)}/>
                  </td>
                  <td style={{color:'var(--gray)'}}>{item.min_stock}</td>
                  <td style={{fontSize:'0.75rem'}}>{item.unit}</td>
                  <td>₹{item.cost_per_unit}</td>
                  <td style={{fontSize:'0.73rem',color:'var(--gray)'}}>{item.supplier||'—'}</td>
                  <td>{isLow ? <span className="status-badge cancelled">Low Stock</span> : <span className="status-badge completed">OK</span>}</td>
                  <td><button className="btn btn-amber btn-xs" onClick={()=>setRestockModal(item)}>+ Restock</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {modal && <div className="modal-bg"><div className="modal-box">
        <h3>Add Inventory Item</h3>
        <div className="form-grid">
          <div className="form-group full"><label className="f-label">Item Name *</label><input className="f-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Arabica Coffee Beans"/></div>
          <div className="form-group"><label className="f-label">Category</label>
            <select className="f-select" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
              <option value="">Select</option>{cats.map(c=><option key={c}>{c}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="f-label">Unit</label>
            <select className="f-select" value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})}>
              {['kg','g','litre','ml','unit','packet','box','dozen'].map(u=><option key={u}>{u}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="f-label">Current Stock</label><input type="number" step="0.1" className="f-input" value={form.current_stock} onChange={e=>setForm({...form,current_stock:e.target.value})}/></div>
          <div className="form-group"><label className="f-label">Min Stock (alert)</label><input type="number" step="0.1" className="f-input" value={form.min_stock} onChange={e=>setForm({...form,min_stock:e.target.value})}/></div>
          <div className="form-group"><label className="f-label">Cost per Unit (₹)</label><input type="number" className="f-input" value={form.cost_per_unit} onChange={e=>setForm({...form,cost_per_unit:e.target.value})}/></div>
          <div className="form-group"><label className="f-label">Supplier</label><input className="f-input" value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})} placeholder="Supplier name"/></div>
        </div>
        <div className="modal-footer"><button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancel</button><button className="btn btn-black" onClick={save} disabled={!form.name}>Add Item</button></div>
      </div></div>}

      {restockModal && <div className="modal-bg"><div className="modal-box" style={{maxWidth:380}}>
        <h3>Restock — {restockModal.name}</h3>
        <p style={{fontSize:'0.8rem',color:'var(--gray)',marginBottom:16}}>Current: <strong>{restockModal.current_stock} {restockModal.unit}</strong> · Min: {restockModal.min_stock} {restockModal.unit}</p>
        <label className="f-label">Add Quantity ({restockModal.unit})</label>
        <input type="number" step="0.1" className="f-input" value={restockQty} onChange={e=>setRestockQty(e.target.value)} placeholder="Enter quantity to add" autoFocus style={{marginTop:8}}/>
        {restockQty && <p style={{fontSize:'0.78rem',color:'var(--green)',marginTop:8}}>New total: {(parseFloat(restockModal.current_stock)+parseFloat(restockQty||0)).toFixed(1)} {restockModal.unit}</p>}
        <div className="modal-footer"><button className="btn btn-ghost" onClick={()=>setRestockModal(null)}>Cancel</button><button className="btn btn-amber" onClick={restock} disabled={!restockQty}>Restock</button></div>
      </div></div>}
    </div>
  );
}

// ══════════════════════════════════════════════
// PHASE 2: LOYALTY PROGRAM
// ══════════════════════════════════════════════
function LoyaltyManager({token, toast, venueId}) {
  const [customers, setCustomers] = useState([]);
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [modal, setModal] = useState(false);
  const [addModal, setAddModal] = useState(false);
  const [regForm, setRegForm] = useState({name:'',phone:'',email:''});
  const [addForm, setAddForm] = useState({points:0,notes:''});

  const load = () => api(`/venues/${venueId}/loyalty/customers`,{},token).then(setCustomers).catch(()=>{});
  useEffect(()=>{ load(); },[]);

  const register = async() => {
    try {
      const r = await api('/loyalty/register',{method:'POST',body:JSON.stringify({...regForm,venue_id:venueId})},token);
      toast('Customer registered!'); setModal(false); load();
      setRegForm({name:'',phone:'',email:''});
    } catch(e) { toast(e.message,'error'); }
  };

  const addPoints = async() => {
    try {
      await api('/loyalty/add-points',{method:'POST',body:JSON.stringify({customer_id:selected.id,points:parseInt(addForm.points),notes:addForm.notes,venue_id:venueId})},token);
      toast(`${addForm.points} points added`); setAddModal(false); setAddForm({points:0,notes:''});
      const updated = await api(`/venues/${venueId}/loyalty/customers`,{},token);
      setCustomers(updated);
      setSelected(updated.find(c=>c.id===selected.id));
    } catch(e) { toast(e.message,'error'); }
  };

  const redeem = async(customerId, points) => {
    const p = parseInt(prompt('How many points to redeem?','100'));
    if (!p || p > points) { toast('Invalid points','error'); return; }
    try {
      await api('/loyalty/redeem',{method:'POST',body:JSON.stringify({customer_id:customerId,points:p,venue_id:venueId})},token);
      toast(`${p} points redeemed (₹${p/10} discount)`);
      load();
    } catch(e) { toast(e.message,'error'); }
  };

  const tierInfo = (pts) => {
    if (pts >= 5000) return {name:'Platinum',color:'#7c3aed',bg:'#f3e8ff'};
    if (pts >= 2000) return {name:'Gold',color:'#d97706',bg:'#fef3c7'};
    if (pts >= 500) return {name:'Silver',color:'#6b7280',bg:'#f3f4f6'};
    return {name:'Bronze',color:'#92400e',bg:'#fef9f0'};
  };

  const filtered = customers.filter(c =>
    !search || c.name?.toLowerCase().includes(search.toLowerCase()) ||
    c.phone?.includes(search) || c.email?.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div className="page-wrap">
      <div className="page-head">
        <div><h2>Loyalty Program</h2><p>{customers.length} registered members · 10 pts = ₹1 discount</p></div>
        <div className="btn-row">
          <input className="f-input" placeholder="🔍 Search by name / phone" value={search}
            onChange={e=>setSearch(e.target.value)} style={{width:220,padding:'8px 12px'}}/>
          <button className="btn btn-black" onClick={()=>setModal(true)}>+ Register Customer</button>
        </div>
      </div>

      <div className="stat-grid" style={{marginBottom:20}}>
        <div className="stat-card"><div className="stat-val">{customers.length}</div><div className="stat-lbl">Members</div></div>
        <div className="stat-card"><div className="stat-val">{customers.reduce((s,c)=>s+(c.total_points||0),0).toLocaleString()}</div><div className="stat-lbl">Total Points</div></div>
        <div className="stat-card amber"><div className="stat-val">{customers.filter(c=>(c.total_points||0)>=2000).length}</div><div className="stat-lbl">Gold+ Members</div></div>
        <div className="stat-card"><div className="stat-val">₹{Math.floor(customers.reduce((s,c)=>s+(c.total_points||0),0)/10).toLocaleString()}</div><div className="stat-lbl">Redeemable Value</div></div>
      </div>

      <div className="tbl-wrap">
        <table className="data-tbl">
          <thead><tr><th>Customer</th><th>Contact</th><th>Tier</th><th>Points</th><th>Total Spent</th><th>Visits</th><th>Member Since</th><th>Actions</th></tr></thead>
          <tbody>
            {filtered.map(c=>{
              const tier = tierInfo(c.total_points||0);
              return (
                <tr key={c.id}>
                  <td style={{fontWeight:500}}>{c.name}</td>
                  <td style={{fontSize:'0.73rem'}}>{c.phone}<br/><span style={{color:'var(--gray)'}}>{c.email}</span></td>
                  <td><span style={{background:tier.bg,color:tier.color,padding:'3px 10px',borderRadius:4,fontSize:'0.62rem',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase'}}>{tier.name}</span></td>
                  <td style={{fontWeight:700,color:'var(--amber)',fontSize:'0.95rem'}}>{(c.total_points||0).toLocaleString()}</td>
                  <td>₹{(c.total_spent||0).toLocaleString()}</td>
                  <td>{c.visit_count||0}</td>
                  <td style={{fontSize:'0.72rem',color:'var(--gray)'}}>{c.created_at?.slice(0,10)}</td>
                  <td>
                    <div className="btn-row">
                      <button className="btn btn-outline btn-xs" onClick={()=>{setSelected(c);setAddModal(true);}}>+ Points</button>
                      <button className="btn btn-amber btn-xs" onClick={()=>redeem(c.id,c.total_points||0)}>Redeem</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {modal && <div className="modal-bg"><div className="modal-box" style={{maxWidth:420}}>
        <h3>Register Loyalty Customer</h3>
        <div className="form-grid">
          <div className="form-group full"><label className="f-label">Name *</label><input className="f-input" value={regForm.name} onChange={e=>setRegForm({...regForm,name:e.target.value})} placeholder="Full name"/></div>
          <div className="form-group"><label className="f-label">Phone *</label><input className="f-input" value={regForm.phone} onChange={e=>setRegForm({...regForm,phone:e.target.value})} placeholder="+91 ..."/></div>
          <div className="form-group"><label className="f-label">Email</label><input className="f-input" value={regForm.email} onChange={e=>setRegForm({...regForm,email:e.target.value})} placeholder="optional"/></div>
        </div>
        <div className="modal-footer"><button className="btn btn-ghost" onClick={()=>setModal(false)}>Cancel</button><button className="btn btn-black" onClick={register} disabled={!regForm.name||!regForm.phone}>Register</button></div>
      </div></div>}

      {addModal && selected && <div className="modal-bg"><div className="modal-box" style={{maxWidth:380}}>
        <h3>Add Points — {selected.name}</h3>
        <p style={{fontSize:'0.8rem',color:'var(--gray)',marginBottom:16}}>Current balance: <strong style={{color:'var(--amber)'}}>{selected.total_points||0} pts</strong></p>
        <div className="form-group" style={{marginBottom:12}}>
          <label className="f-label">Points to Add</label>
          <input type="number" className="f-input" value={addForm.points} onChange={e=>setAddForm({...addForm,points:e.target.value})} placeholder="e.g. 100" autoFocus style={{marginTop:4}}/>
          {addForm.points>0 && <small style={{color:'var(--gray)',fontSize:'0.68rem'}}>Order value ≈ ₹{Math.round(addForm.points*10)}</small>}
        </div>
        <div className="form-group">
          <label className="f-label">Notes (optional)</label>
          <input className="f-input" value={addForm.notes} onChange={e=>setAddForm({...addForm,notes:e.target.value})} placeholder="Order #, reason…" style={{marginTop:4}}/>
        </div>
        <div className="modal-footer"><button className="btn btn-ghost" onClick={()=>setAddModal(false)}>Cancel</button><button className="btn btn-amber" onClick={addPoints} disabled={!addForm.points}>Add Points</button></div>
      </div></div>}
    </div>
  );
}

// PHASE 2: REPORTS
// ══════════════════════════════════════════════
function ReportsManager({token, toast, venueId}) {
  const [daily, setDaily] = useState(null);
  const [monthly, setMonthly] = useState(null);
  const [date, setDate] = useState(new Date().toISOString().slice(0,10));
  const [month, setMonth] = useState(new Date().getMonth()+1);
  const [year, setYear] = useState(new Date().getFullYear());
  const [tab, setTab] = useState('daily');

  useEffect(()=>{
    if (tab==='daily') {
      api(`/venues/${venueId}/reports/daily?date=${date}`,{},token).then(setDaily).catch(()=>{});
    } else {
      api(`/venues/${venueId}/reports/monthly?month=${month}&year=${year}`,{},token).then(setMonthly).catch(()=>{});
    }
  },[tab,date,month,year]);

  const Row = ({label,value,sub,highlight}) => (
    <div style={{display:'flex',justifyContent:'space-between',padding:'10px 16px',borderBottom:'1px solid var(--lg)',fontSize:'0.82rem'}}>
      <span style={{color:'var(--dark-gray)'}}>{label}</span>
      <div style={{textAlign:'right'}}>
        <strong style={{color:highlight||'var(--black)'}}>{value}</strong>
        {sub && <div style={{fontSize:'0.68rem',color:'var(--gray)'}}>{sub}</div>}
      </div>
    </div>
  );

  const d = daily;
  const m = monthly;

  return (
    <div className="page-wrap">
      <div className="page-head"><div><h2>Reports</h2><p>Daily & monthly performance</p></div></div>

      <div className="tab-bar">
        <button className={`tab-btn ${tab==='daily'?'active':''}`} onClick={()=>setTab('daily')}>Daily Report</button>
        <button className={`tab-btn ${tab==='monthly'?'active':''}`} onClick={()=>setTab('monthly')}>Monthly Report</button>
      </div>

      {tab==='daily' && <>
        <div style={{marginBottom:20,display:'flex',gap:12,alignItems:'center'}}>
          <input type="date" className="f-input" value={date} onChange={e=>setDate(e.target.value)} style={{width:180,padding:'8px 12px'}}/>
          <button className="btn btn-ghost btn-sm" onClick={()=>api(`/venues/${venueId}/reports/daily?date=${date}`,{method:'POST'},token).then(()=>{toast('Report generated');api(`/venues/${venueId}/reports/daily?date=${date}`,{},token).then(setDaily);}).catch(e=>toast(e.message,'error'))}>Generate Report</button>
        </div>
        {!d ? <div className="empty">No report for this date. Click "Generate Report".</div> : (
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div className="tbl-wrap">
              <div style={{padding:'12px 16px',fontWeight:600,fontSize:'0.65rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gray)',borderBottom:'1px solid var(--lg)'}}>Revenue Summary</div>
              <Row label="Total Orders" value={d.total_orders||0}/>
              <Row label="Gross Revenue" value={`₹${(d.gross_revenue||0).toLocaleString()}`} highlight="var(--green)"/>
              <Row label="Tax Collected" value={`₹${(d.tax_collected||0).toLocaleString()}`}/>
              <Row label="Discounts Given" value={`₹${(d.discounts||0).toLocaleString()}`} highlight="var(--red)"/>
              <Row label="Net Revenue" value={`₹${(d.net_revenue||0).toLocaleString()}`} highlight="var(--green)"/>
              <Row label="Avg Order Value" value={`₹${(d.avg_order_value||0).toFixed(0)}`}/>
            </div>
            <div className="tbl-wrap">
              <div style={{padding:'12px 16px',fontWeight:600,fontSize:'0.65rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gray)',borderBottom:'1px solid var(--lg)'}}>Operations</div>
              <Row label="Dine-in Orders" value={d.dine_in_orders||0}/>
              <Row label="Takeaway Orders" value={d.takeaway_orders||0}/>
              <Row label="Cash Payments" value={`₹${(d.cash_revenue||0).toLocaleString()}`}/>
              <Row label="Digital Payments" value={`₹${(d.digital_revenue||0).toLocaleString()}`}/>
              <Row label="Expenses" value={`₹${(d.total_expenses||0).toLocaleString()}`} highlight="var(--red)"/>
              <Row label="Net Profit" value={`₹${((d.net_revenue||0)-(d.total_expenses||0)).toLocaleString()}`} highlight="var(--green)"/>
            </div>
            {(d.top_items||[]).length>0 && (
              <div className="tbl-wrap" style={{gridColumn:'1/-1'}}>
                <div style={{padding:'12px 16px',fontWeight:600,fontSize:'0.65rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gray)',borderBottom:'1px solid var(--lg)'}}>Top Items of the Day</div>
                <table className="data-tbl">
                  <thead><tr><th>#</th><th>Item</th><th>Qty Sold</th><th>Revenue</th></tr></thead>
                  <tbody>{d.top_items.map((item,i)=><tr key={i}><td style={{color:'var(--gray)'}}>{i+1}</td><td style={{fontWeight:500}}>{item.name}</td><td>{item.qty}</td><td>₹{(item.revenue||0).toFixed(0)}</td></tr>)}</tbody>
                </table>
              </div>
            )}
          </div>
        )}
      </>}

      {tab==='monthly' && <>
        <div style={{marginBottom:20,display:'flex',gap:12,alignItems:'center'}}>
          <select className="f-select" value={month} onChange={e=>setMonth(e.target.value)} style={{width:130,padding:'8px 12px'}}>
            {['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map((mo,i)=><option key={i} value={i+1}>{mo}</option>)}
          </select>
          <input type="number" className="f-input" value={year} onChange={e=>setYear(e.target.value)} style={{width:90,padding:'8px 12px'}}/>
        </div>
        {!m ? <div className="loading"><div className="spin"/>Loading…</div> : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:12}}>
            <div className="stat-card"><div className="stat-val">{m.total_orders||0}</div><div className="stat-lbl">Total Orders</div></div>
            <div className="stat-card green"><div className="stat-val">₹{(m.gross_revenue||0).toLocaleString()}</div><div className="stat-lbl">Gross Revenue</div></div>
            <div className="stat-card red"><div className="stat-val">₹{(m.total_expenses||0).toLocaleString()}</div><div className="stat-lbl">Total Expenses</div></div>
            <div className="stat-card red"><div className="stat-val">₹{(m.salary_paid||0).toLocaleString()}</div><div className="stat-lbl">Salary Paid</div></div>
            <div className="stat-card green"><div className="stat-val">₹{((m.gross_revenue||0)-(m.total_expenses||0)-(m.salary_paid||0)).toLocaleString()}</div><div className="stat-lbl">Net Profit</div></div>
            <div className="stat-card"><div className="stat-val">{m.avg_order_value||0}</div><div className="stat-lbl">Avg Order (₹)</div></div>
            <div className="stat-card amber"><div className="stat-val">{m.new_loyalty_members||0}</div><div className="stat-lbl">New Members</div></div>
            <div className="stat-card"><div className="stat-val">{m.total_reservations||0}</div><div className="stat-lbl">Reservations</div></div>
          </div>
        )}
      </>}
    </div>
  );
}

// PHASE 2: FEEDBACK
// ══════════════════════════════════════════════
function FeedbackManager({token, toast, venueId}) {
  const [feedback, setFeedback] = useState([]);
  const [filter, setFilter] = useState('all');

  const load = () => api(`/venues/${venueId}/feedback`,{},token).then(setFeedback).catch(()=>{});
  useEffect(()=>{ load(); },[]);

  const avg = (arr, key) => arr.length ? (arr.reduce((s,f)=>s+(f[key]||0),0)/arr.length).toFixed(1) : '—';
  const stars = n => '★'.repeat(Math.round(n||0)) + '☆'.repeat(5-Math.round(n||0));

  const filtered = filter==='all' ? feedback : feedback.filter(f=>f.rating<=parseInt(filter));

  return (
    <div className="page-wrap">
      <div className="page-head"><div><h2>Customer Feedback</h2><p>{feedback.length} reviews</p></div><button className="btn btn-ghost btn-sm" onClick={load}>↻ Refresh</button></div>

      {feedback.length > 0 && (
        <div className="stat-grid" style={{marginBottom:20}}>
          <div className="stat-card"><div className="stat-val" style={{fontSize:'1.8rem',color:'var(--amber)'}}>{avg(feedback,'rating')} ⭐</div><div className="stat-lbl">Overall Rating</div></div>
          <div className="stat-card"><div className="stat-val" style={{fontSize:'1.8rem',color:'var(--amber)'}}>{avg(feedback,'food_rating')} ⭐</div><div className="stat-lbl">Food Rating</div></div>
          <div className="stat-card"><div className="stat-val" style={{fontSize:'1.8rem',color:'var(--amber)'}}>{avg(feedback,'service_rating')} ⭐</div><div className="stat-lbl">Service Rating</div></div>
          <div className="stat-card"><div className="stat-val" style={{fontSize:'1.8rem',color:'var(--amber)'}}>{avg(feedback,'ambiance_rating')} ⭐</div><div className="stat-lbl">Ambiance</div></div>
          <div className="stat-card green"><div className="stat-val">{feedback.filter(f=>f.would_recommend).length}</div><div className="stat-lbl">Would Recommend</div></div>
        </div>
      )}

      <div className="tab-bar">
        <button className={`tab-btn ${filter==='all'?'active':''}`} onClick={()=>setFilter('all')}>All</button>
        <button className={`tab-btn ${filter==='1'?'active':''}`} onClick={()=>setFilter('1')} style={{color:'var(--red)'}}>★ 1</button>
        <button className={`tab-btn ${filter==='2'?'active':''}`} onClick={()=>setFilter('2')}>★★ 2</button>
        <button className={`tab-btn ${filter==='3'?'active':''}`} onClick={()=>setFilter('3')}>★★★ 3</button>
      </div>

      {filtered.length === 0 ? <div className="empty">No feedback yet</div> : (
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {filtered.map(f=>(
            <div key={f.id} style={{background:'var(--white)',border:'1px solid var(--lg)',borderRadius:'var(--r)',padding:20}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                <div>
                  <div style={{fontWeight:600}}>{f.customer_name||'Anonymous'}</div>
                  <div style={{fontSize:'0.7rem',color:'var(--gray)'}}>{f.created_at?.slice(0,10)} · Order #{f.order_id?.slice(0,8)}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{color:'#f59e0b',fontSize:'1.1rem',letterSpacing:2}}>{stars(f.rating)}</div>
                  <div style={{fontSize:'0.65rem',color:'var(--gray)'}}>{f.rating}/5</div>
                </div>
              </div>
              {f.comment && <p style={{fontSize:'0.82rem',color:'var(--dark-gray)',lineHeight:1.6,marginBottom:10,fontStyle:'italic'}}>"{f.comment}"</p>}
              <div style={{display:'flex',gap:16,fontSize:'0.7rem',color:'var(--gray)'}}>
                {f.food_rating && <span>🍽 Food: <strong>{f.food_rating}/5</strong></span>}
                {f.service_rating && <span>👨‍🍳 Service: <strong>{f.service_rating}/5</strong></span>}
                {f.ambiance_rating && <span>✨ Ambiance: <strong>{f.ambiance_rating}/5</strong></span>}
                <span style={{marginLeft:'auto',color:f.would_recommend?'var(--green)':'var(--red)'}}>{f.would_recommend?'✓ Recommends':'✗ Would not recommend'}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════
// PHASE 3: GOOGLE SHEETS INTEGRATION PANEL
// ══════════════════════════════════════════════
function GoogleSheetsPanel({token, toast, user}) {
  const [status, setStatus] = useState(null);
  const [config, setConfig] = useState({orders_sheet_id:'', employees_sheet_id:''});
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);
  const [syncing, setSyncing] = useState({orders:false, employees:false});
  const [syncDays, setSyncDays] = useState(30);
  const isSA = user.role === 'super_admin';

  const loadStatus = () => {
    api('/sheets/status',{},token).then(s=>{
      setStatus(s);
      setConfig({
        orders_sheet_id: s.orders_sheet_id||'',
        employees_sheet_id: s.employees_sheet_id||''
      });
    }).catch(()=>{});
  };
  useEffect(()=>{ loadStatus(); },[]);

  const saveConfig = async() => {
    try {
      const r = await api('/sheets/config',{method:'POST',body:JSON.stringify(config)},token);
      setStatus(r.status);
      toast('Configuration saved!');
    } catch(e) { toast(e.message,'error'); }
  };

  const testConnection = async() => {
    setTesting(true); setTestResult(null);
    try {
      const r = await api('/sheets/test',{method:'POST'},token);
      setTestResult(r);
      if (r.success) toast('Connection successful! ✓');
      else toast(r.error||'Connection failed','error');
    } catch(e) { toast(e.message,'error'); setTestResult({success:false,error:e.message}); }
    setTesting(false);
  };

  const syncOrders = async() => {
    setSyncing(s=>({...s,orders:true}));
    try {
      const r = await api('/sheets/sync/orders',{method:'POST',body:JSON.stringify({days:syncDays})},token);
      toast(r.message||'Sync started!');
    } catch(e) { toast(e.message,'error'); }
    setTimeout(()=>setSyncing(s=>({...s,orders:false})), 2000);
  };

  const syncEmployees = async() => {
    setSyncing(s=>({...s,employees:true}));
    try {
      const r = await api('/sheets/sync/employees',{method:'POST'},token);
      toast(r.message||'Sync started!');
    } catch(e) { toast(e.message,'error'); }
    setTimeout(()=>setSyncing(s=>({...s,employees:false})), 2000);
  };

  const StatusDot = ({ok}) => (
    <span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',
      background:ok?'var(--green)':'var(--red)',marginRight:6}}/>
  );

  return (
    <div className="page-wrap">
      <div className="page-head">
        <div>
          <h2>Google Sheets Integration</h2>
          <p>Auto-sync orders & employee records to Google Sheets</p>
        </div>
        <button className="btn btn-ghost btn-sm" onClick={loadStatus}>↻ Refresh</button>
      </div>

      {/* Setup Guide */}
      <div style={{background:'#dbeafe',border:'1px solid #3b82f6',borderRadius:'var(--r)',padding:20,marginBottom:24}}>
        <div style={{fontWeight:600,fontSize:'0.85rem',color:'#1e40af',marginBottom:10}}>📋 Setup Guide (One-time)</div>
        <ol style={{fontSize:'0.78rem',color:'#1e3a8a',lineHeight:2,paddingLeft:20}}>
          <li>Go to <strong>Google Cloud Console</strong> → Create a project → Enable <strong>Google Sheets API</strong> + <strong>Google Drive API</strong></li>
          <li>Create a <strong>Service Account</strong> → Download the JSON key → rename to <code style={{background:'#bfdbfe',padding:'1px 6px',borderRadius:3}}>credentials.json</code></li>
          <li>Place <code style={{background:'#bfdbfe',padding:'1px 6px',borderRadius:3}}>credentials.json</code> in the same folder as <code style={{background:'#bfdbfe',padding:'1px 6px',borderRadius:3}}>app.py</code></li>
          <li>Create <strong>two Google Sheets</strong> (one for Orders, one for Employees)</li>
          <li><strong>Share both sheets</strong> with the service account email (Editor access)</li>
          <li>Copy each Sheet's <strong>ID from the URL</strong>: <code style={{background:'#bfdbfe',padding:'1px 6px',borderRadius:3}}>docs.google.com/spreadsheets/d/<strong>SHEET_ID</strong>/edit</code></li>
          <li>Paste the IDs below and click Save Config, then Test Connection</li>
        </ol>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>

        {/* Config Card */}
        <div style={{background:'var(--white)',border:'1px solid var(--lg)',borderRadius:'var(--r)',padding:24}}>
          <h3 style={{fontSize:'1rem',fontWeight:500,marginBottom:16,fontFamily:'Jost,sans-serif'}}>⚙️ Sheet Configuration</h3>

          {/* Status indicators */}
          {status && (
            <div style={{marginBottom:16,padding:12,background:'var(--off)',borderRadius:6,fontSize:'0.75rem',lineHeight:2}}>
              <div><StatusDot ok={status.gspread_installed}/>gspread library: {status.gspread_installed?'Installed':'Not installed (pip install gspread)'}</div>
              <div><StatusDot ok={status.credentials_found}/>credentials.json: {status.credentials_found?'Found ✓':'Not found — place file in app folder'}</div>
              <div><StatusDot ok={status.connected}/>Google Auth: {status.connected?'Connected ✓':'Not connected'}</div>
              <div><StatusDot ok={status.orders_sheet_set}/>Orders Sheet: {status.orders_sheet_set?'Configured ✓':'Not set'}</div>
              <div><StatusDot ok={status.employees_sheet_set}/>Employees Sheet: {status.employees_sheet_set?'Configured ✓':'Not set'}</div>
            </div>
          )}

          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div>
              <label className="f-label">Orders Sheet ID</label>
              <input className="f-input" value={config.orders_sheet_id}
                onChange={e=>setConfig({...config,orders_sheet_id:e.target.value})}
                placeholder="Paste Google Sheet ID here" style={{marginTop:4}}
                disabled={!isSA}/>
              <small style={{fontSize:'0.65rem',color:'var(--gray)'}}>From URL: spreadsheets/d/<strong>THIS_PART</strong>/edit</small>
            </div>
            <div>
              <label className="f-label">Employees Sheet ID</label>
              <input className="f-input" value={config.employees_sheet_id}
                onChange={e=>setConfig({...config,employees_sheet_id:e.target.value})}
                placeholder="Paste Google Sheet ID here" style={{marginTop:4}}
                disabled={!isSA}/>
            </div>
            {isSA && (
              <div className="btn-row" style={{marginTop:4}}>
                <button className="btn btn-black" onClick={saveConfig}>Save Config</button>
                <button className="btn btn-ghost" onClick={testConnection} disabled={testing}>
                  {testing ? '⏳ Testing…' : '🔌 Test Connection'}
                </button>
              </div>
            )}
            {testResult && (
              <div style={{padding:10,borderRadius:6,fontSize:'0.75rem',
                background:testResult.success?'#dcfce7':'#fee2e2',
                border:`1px solid ${testResult.success?'#22c55e':'#dc2626'}`,
                color:testResult.success?'#166534':'#991b1b'}}>
                {testResult.success ? (
                  <>
                    ✅ Connected!
                    {testResult.orders_sheet && <div>📊 Orders: <strong>{testResult.orders_sheet}</strong></div>}
                    {testResult.employees_sheet && <div>👥 Employees: <strong>{testResult.employees_sheet}</strong></div>}
                    {testResult.orders_error && <div>⚠ Orders Sheet: {testResult.orders_error}</div>}
                    {testResult.employees_error && <div>⚠ Employees Sheet: {testResult.employees_error}</div>}
                  </>
                ) : <div>❌ {testResult.error}</div>}
              </div>
            )}
          </div>
        </div>

        {/* Sync Controls */}
        <div style={{display:'flex',flexDirection:'column',gap:16}}>

          {/* Orders Sync */}
          <div style={{background:'var(--white)',border:'1px solid var(--lg)',borderRadius:'var(--r)',padding:24}}>
            <h3 style={{fontSize:'1rem',fontWeight:500,marginBottom:4,fontFamily:'Jost,sans-serif'}}>🧾 Orders Sheet</h3>
            <p style={{fontSize:'0.72rem',color:'var(--gray)',marginBottom:14}}>
              New orders sync automatically. Use this to bulk-sync historical data.
            </p>
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12}}>
              <label className="f-label" style={{whiteSpace:'nowrap'}}>Last</label>
              <select className="f-select" value={syncDays} onChange={e=>setSyncDays(e.target.value)} style={{width:100}}>
                <option value={7}>7 days</option>
                <option value={30}>30 days</option>
                <option value={90}>90 days</option>
                <option value={365}>365 days</option>
              </select>
              <label className="f-label">of orders</label>
            </div>
            <button className="btn btn-black" style={{width:'100%'}} onClick={syncOrders} disabled={syncing.orders||!status?.orders_sheet_set}>
              {syncing.orders ? '⏳ Syncing…' : '↑ Sync Orders to Sheet'}
            </button>
            {!status?.orders_sheet_set && <small style={{color:'var(--red)',fontSize:'0.68rem'}}>Set Orders Sheet ID first</small>}
            <div style={{marginTop:10,padding:10,background:'var(--off)',borderRadius:4,fontSize:'0.7rem',color:'var(--gray)',lineHeight:1.8}}>
              <strong>Columns exported:</strong><br/>
              Order ID · Date · Time · Venue · Table · Customer · Type · Items · Subtotal · Tax · Discount · Total · Payment · Status · Spice · Notes
            </div>
          </div>

          {/* Employees Sync */}
          <div style={{background:'var(--white)',border:'1px solid var(--lg)',borderRadius:'var(--r)',padding:24}}>
            <h3 style={{fontSize:'1rem',fontWeight:500,marginBottom:4,fontFamily:'Jost,sans-serif'}}>👥 Employees Sheet</h3>
            <p style={{fontSize:'0.72rem',color:'var(--gray)',marginBottom:14}}>
              Syncs automatically when staff are added. Full refresh here.
            </p>
            <button className="btn btn-outline" style={{width:'100%'}} onClick={syncEmployees} disabled={syncing.employees||!status?.employees_sheet_set}>
              {syncing.employees ? '⏳ Syncing…' : '↑ Sync All Employees'}
            </button>
            {!status?.employees_sheet_set && <small style={{color:'var(--red)',fontSize:'0.68rem'}}>Set Employees Sheet ID first</small>}
            <div style={{marginTop:10,padding:10,background:'var(--off)',borderRadius:4,fontSize:'0.7rem',color:'var(--gray)',lineHeight:1.8}}>
              <strong>Columns exported:</strong><br/>
              Name · Role · Email · Phone · Venue · Salary Type · Base Salary · Joining Date · Notes
            </div>
          </div>
        </div>
      </div>

      {/* Live Sync Info */}
      <div style={{marginTop:20,background:'#f0fdf4',border:'1px solid #22c55e',borderRadius:'var(--r)',padding:16,fontSize:'0.78rem',color:'#166534'}}>
        <strong>✅ Live Auto-Sync:</strong> Every new order is automatically pushed to your Orders Sheet within seconds of being placed (from both admin and customer app). Every new staff member added is automatically synced to the Employees Sheet.
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// ROOT APP
// ══════════════════════════════════════════════
function App() {
  const [auth,setAuth]=useState(null);
  const [page,setPage]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const {toasts,toast}=useToast();

  // Check URL for QR code
  useEffect(()=>{
    if(window.location.pathname.startsWith('/qr/')){
      setPage('customer-qr');
      return;
    }
    const saved=localStorage.getItem('aosa_auth');
    if(saved){try{const a=JSON.parse(saved);setAuth(a);setDefaultPage(a.user.role);}catch{}}
  },[]);

  const setDefaultPage=(role)=>{
    const defaults={super_admin:'overview',manager:'dashboard',waiter:'waiter-orders',kitchen:'kitchen-view'};
    setPage(defaults[role]||'overview');
  };

  const handleLogin=(data)=>{
    localStorage.setItem('aosa_auth',JSON.stringify(data));
    setAuth(data);setDefaultPage(data.user.role);
  };

  const handleLogout=()=>{
    if(auth?.token) api('/auth/logout',{method:'POST'},auth.token).catch(()=>{});
    localStorage.removeItem('aosa_auth');setAuth(null);setPage(null);
  };

  // QR landing without login
  if(page==='customer-qr') return <><CustomerApp onBack={null}/><Toasts toasts={toasts}/></>;

  if(!auth) return <><Login onLogin={handleLogin}/><Toasts toasts={toasts}/></>;

  const {user,token}=auth;
  const venueId=user.venue_id;

  // Customer view accessible to all roles
  if(page==='customer') return <><CustomerApp onBack={()=>setDefaultPage(user.role)}/><Toasts toasts={toasts}/></>;

  // Kitchen gets full-screen dark view
  if(page==='kitchen-view') return (
    <div className="app-shell">
      <button className={`hamburger ${sidebarOpen?'open':''}`}
        onClick={()=>setSidebarOpen(o=>!o)} aria-label="Toggle menu"
        style={{background:'var(--white)'}}>
        <span style={{background:'var(--black)'}}/><span style={{background:'var(--black)'}}/><span style={{background:'var(--black)'}}/>
      </button>
      <div className={`sidebar-overlay ${sidebarOpen?'open':''}`} onClick={closeSidebar}/>
      <div className={`sidebar ${sidebarOpen?'open':''}`}>
        <Sidebar user={user} page={page} setPage={navAndClose} onLogout={handleLogout}/>
      </div>
      <div className="main-area" style={{background:'var(--black)',overflow:'auto'}}>
        <KitchenView token={token} toast={toast} venueId={venueId}/>
      </div>
      <Toasts toasts={toasts}/>
    </div>
  );

  const renderPage=()=>{
    switch(page){
      // Super admin
      case 'overview': return <Overview token={token} toast={toast}/>;
      case 'venues': return <VenuesManager token={token} toast={toast}/>;
      case 'all-staff': return <StaffManager token={token} toast={toast} isSuperAdmin={true}/>;
      case 'qr-manager': return <QRManager token={token} toast={toast}/>;
      case 'salary-all': return <SalaryManager token={token} toast={toast} venueId={null}/>;
      // Manager
      case 'dashboard': return <Dashboard token={token} toast={toast} venueId={venueId}/>;
      case 'orders': return <OrdersManager token={token} toast={toast} venueId={venueId}/>;
      case 'tables': return <TablesView token={token} toast={toast} venueId={venueId}/>;
      case 'menu': return <MenuManager token={token} toast={toast} venueId={venueId}/>;
      case 'staff': return <StaffManager token={token} toast={toast} venueId={venueId} isSuperAdmin={false}/>;
      case 'attendance': return <AttendanceManager token={token} toast={toast} venueId={venueId}/>;
      case 'salary': return <SalaryManager token={token} toast={toast} venueId={venueId}/>;
      case 'advances': return <AdvancesManager token={token} toast={toast} venueId={venueId}/>;
      case 'leaves': return <LeavesManager token={token} toast={toast} venueId={venueId}/>;
      case 'shifts': return <ShiftScheduler token={token} toast={toast} venueId={venueId}/>
      case 'expenses': return <ExpensesManager token={token} toast={toast} venueId={venueId}/>;
      case 'analytics': return <Analytics token={token} venueId={venueId}/>;
      // Waiter
      case 'waiter-orders': return <WaiterOrders token={token} toast={toast} venueId={venueId}/>;
      case 'new-order': return <CustomerApp onBack={()=>setPage('waiter-orders')}/>;
      case 'reservations': return <ReservationsManager token={token} toast={toast} venueId={venueId}/>;
      case 'inventory-mgr': return <InventoryManager token={token} toast={toast} venueId={venueId}/>;
      case 'loyalty': return <LoyaltyManager token={token} toast={toast} venueId={venueId}/>;
      case 'reports': return <ReportsManager token={token} toast={toast} venueId={venueId}/>;
      case 'feedback': return <FeedbackManager token={token} toast={toast} venueId={venueId}/>;
            case 'sheets': return <GoogleSheetsPanel token={token} toast={toast} user={user}/>
            default: return <div className="page-wrap"><div className="loading">Select a page</div></div>;
    }
  };

  const closeSidebar = () => setSidebarOpen(false);
  const navAndClose = (p) => { setPage(p); setSidebarOpen(false); };

  return (
    <div className="app-shell">
      {/* Hamburger button — mobile only */}
      <button className={`hamburger ${sidebarOpen?'open':''}`}
        onClick={()=>setSidebarOpen(o=>!o)}
        aria-label="Toggle menu">
        <span/><span/><span/>
      </button>
      {/* Overlay backdrop */}
      <div className={`sidebar-overlay ${sidebarOpen?'open':''}`} onClick={closeSidebar}/>
      {/* Sidebar */}
      <div className={`sidebar ${sidebarOpen?'open':''}`}>
        <Sidebar user={user} page={page} setPage={navAndClose} onLogout={handleLogout}/>
      </div>
      <div className="main-area">{renderPage()}</div>
      <Toasts toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
