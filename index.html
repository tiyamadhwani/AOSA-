<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0d0d'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white'%3E☕%3C/text%3E%3C/svg%3E" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aosa — Bakehouse & Roastery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.2.0/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#ffffff;
  --off-white:#fafaf8;
  --paper:#f5f4f0;
  --light-gray:#ebebeb;
  --mid-gray:#d0d0d0;
  --gray:#888;
  --dark-gray:#444;
  --black:#0d0d0d;
  --ink:#1a1a1a;
  --accent:#1a1a1a;
  --r:10px;
}
html,body,#root{height:100%;background:var(--white);color:var(--ink);font-family:'Jost',sans-serif}
h1,h2,h3,h4,h5{font-family:'Cormorant Garamond',serif}
button{cursor:pointer;font-family:'Jost',sans-serif}
input,textarea,select{font-family:'Jost',sans-serif;color:var(--ink)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--off-white)}
::-webkit-scrollbar-thumb{background:var(--mid-gray);border-radius:2px}


/* ── SPLASH ── */
.splash{display:flex;flex-direction:column;min-height:100vh;background:var(--white);overflow-y:auto}
.splash-hero{position:relative;height:100vh;min-height:600px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;flex-shrink:0}
.splash-hero-bg{position:absolute;inset:0;background-image:url('https://static.wixstatic.com/media/5354eb_272dec4bd8cc4989b44bbef14561e499~mv2.jpg/v1/fill/w_1200,h_800,q_90,enc_avif,quality_auto/5354eb_272dec4bd8cc4989b44bbef14561e499~mv2.jpg');background-size:cover;background-position:center;filter:brightness(0.35)}
.splash-hero-content{position:relative;z-index:2;text-align:center;padding:40px 24px}
.splash-logo-box{display:flex;align-items:center;justify-content:center;background:#fff;padding:16px 24px;border-radius:8px;margin:0 auto 20px;width:fit-content;box-shadow:0 4px 24px rgba(0,0,0,0.18)}.splash-logo{display:block;height:80px;width:auto}
.splash-tagline{font-size:0.68rem;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,0.7);font-weight:400;margin-bottom:8px}
.splash-divider{width:40px;height:1px;background:rgba(255,255,255,0.3);margin:24px auto}
.splash-hero-desc{font-size:0.88rem;color:rgba(255,255,255,0.6);letter-spacing:1px;max-width:420px;line-height:1.8;margin-bottom:32px;font-style:italic}
.splash-btns{display:flex;gap:12px;justify-content:center}
.splash-btn{padding:13px 36px;font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;font-weight:500;border-radius:0;transition:all .2s;cursor:pointer}
.splash-btn.primary{background:var(--white);color:var(--black);border:1px solid var(--white)}
.splash-btn.primary:hover{background:transparent;color:var(--white)}
.splash-btn.secondary{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,0.5)}
.splash-btn.secondary:hover{border-color:var(--white)}
.splash-scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:0.62rem;letter-spacing:3px;text-transform:uppercase;animation:bob 2s ease-in-out infinite;z-index:2}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

/* SEATING SECTION */
.splash-seating{background:var(--white);padding:60px 40px}
.ss-heading{text-align:center;margin-bottom:48px}
.ss-heading h2{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:300;color:var(--black);margin-bottom:6px}
.ss-heading p{font-size:0.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--gray)}
.seating-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1100px;margin:0 auto 48px}
.seat-card{position:relative;cursor:pointer;overflow:hidden;aspect-ratio:4/3;border:2px solid transparent;transition:border-color .2s}
.seat-card.selected{border-color:var(--black)}
.seat-img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.seat-card:hover .seat-img{transform:scale(1.03)}
.seat-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65) 0%,rgba(0,0,0,.1) 60%)}
.seat-card.selected .seat-overlay{background:linear-gradient(to top,rgba(0,0,0,.7) 0%,rgba(0,0,0,.3) 100%)}
.seat-info{position:absolute;bottom:0;left:0;right:0;padding:20px}
.seat-type{font-size:0.55rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.7);margin-bottom:4px}
.seat-name{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:var(--white);margin-bottom:4px}
.seat-desc{font-size:0.7rem;color:rgba(255,255,255,0.7);line-height:1.5}
.seat-check{position:absolute;top:14px;right:14px;width:28px;height:28px;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:0.8rem;opacity:0;transition:opacity .2s}
.seat-card.selected .seat-check{opacity:1}
.ss-cta{text-align:center}
.splash-note{font-size:0.68rem;color:var(--mid-gray);margin-top:12px;letter-spacing:1px}

/* MENU TAGS */
.item-tag{font-size:0.55rem;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;font-weight:600;border-radius:2px}
.item-tag.bestseller{background:#0d0d0d;color:#fff}
.item-tag.recommended{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.item-tag.new{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.item-tag.mustTry{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}


/* ── LAYOUT ── */
.app-layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;min-width:240px;background:var(--white);border-right:1px solid var(--light-gray);display:flex;flex-direction:column}
.main-area{flex:1;overflow-y:auto;background:var(--off-white)}

/* ── SIDEBAR ── */
.sb-brand{padding:32px 24px 24px;border-bottom:1px solid var(--light-gray)}
.sb-brand-logo{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;letter-spacing:4px;color:var(--black)}
.sb-brand-sub{font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:var(--gray);margin-top:2px}
.sb-section-label{padding:20px 24px 6px;font-size:0.58rem;letter-spacing:3px;text-transform:uppercase;color:var(--mid-gray)}
.sb-nav-item{display:flex;align-items:center;gap:10px;padding:11px 24px;cursor:pointer;transition:all .15s;font-size:0.82rem;color:var(--gray);font-weight:400;letter-spacing:0.3px;border-left:2px solid transparent}
.sb-nav-item:hover{color:var(--ink);background:var(--paper)}
.sb-nav-item.active{color:var(--black);border-left:2px solid var(--black);background:var(--off-white);font-weight:500}
.sb-nav-icon{width:16px;text-align:center;font-size:0.85rem}
.mode-switcher{margin:12px 16px;display:flex;background:var(--paper);border-radius:6px;padding:3px;border:1px solid var(--light-gray)}
.mode-btn{flex:1;padding:8px;border:none;background:none;font-size:0.72rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:all .15s;color:var(--gray);font-family:'Jost',sans-serif;font-weight:500}
.mode-btn.active{background:var(--black);color:var(--white)}
.sb-cart-info{padding:12px 24px;background:var(--paper);margin:8px 12px;border-radius:8px;border:1px solid var(--light-gray)}
.sb-cart-row{display:flex;justify-content:space-between;font-size:0.8rem}
.sb-cart-row span:first-child{color:var(--gray)}
.sb-cart-row span:last-child{color:var(--black);font-weight:500}
.sb-footer{margin-top:auto;padding:16px 24px;border-top:1px solid var(--light-gray);font-size:0.68rem;color:var(--mid-gray);letter-spacing:0.5px}

/* ── PAGE HEADER ── */
.page-head{padding:36px 40px 24px;background:var(--white);border-bottom:1px solid var(--light-gray)}
.page-head h2{font-size:2rem;font-weight:300;color:var(--black);letter-spacing:1px}
.page-head p{font-size:0.78rem;color:var(--gray);margin-top:4px;letter-spacing:0.5px}

/* ── VENUE PICKER ── */
.venue-pick-wrap{padding:40px}
.venue-pick-title{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:300;margin-bottom:6px;color:var(--black)}
.venue-pick-sub{font-size:0.75rem;color:var(--gray);letter-spacing:2px;text-transform:uppercase;margin-bottom:36px}
.venue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.venue-card{background:var(--white);border:1px solid var(--light-gray);padding:24px;cursor:pointer;transition:all .2s;position:relative}
.venue-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--black);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.venue-card:hover::after{transform:scaleX(1)}
.venue-card:hover{border-color:var(--mid-gray)}
.vc-type{font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:var(--gray);margin-bottom:8px}
.vc-name{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:var(--black);margin-bottom:6px}
.vc-desc{font-size:0.75rem;color:var(--dark-gray);line-height:1.5}
.vc-addr{font-size:0.7rem;color:var(--gray);margin-top:12px}
.vc-arrow{position:absolute;top:24px;right:24px;color:var(--mid-gray);font-size:1rem;transition:transform .2s}
.venue-card:hover .vc-arrow{transform:translateX(4px);color:var(--black)}

/* ── MENU BROWSE ── */
.menu-layout{display:grid;grid-template-columns:1fr 340px;height:100vh;overflow:hidden}
.menu-left{overflow-y:auto}
.menu-top-bar{padding:16px 28px;background:var(--white);border-bottom:1px solid var(--light-gray);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.menu-venue-name{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400}
.menu-cat-tabs{display:flex;gap:0;overflow-x:auto;padding:0 28px;background:var(--white);border-bottom:1px solid var(--light-gray);position:sticky;top:57px;z-index:19}
.menu-cat-tabs::-webkit-scrollbar{height:0}
.cat-tab{padding:12px 16px;font-size:0.7rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;color:var(--gray);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-weight:500}
.cat-tab:hover{color:var(--ink)}
.cat-tab.active{color:var(--black);border-bottom:2px solid var(--black)}
.menu-section{padding:0}
.menu-section-title{padding:20px 28px 10px;font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;color:var(--black);letter-spacing:0.5px;border-bottom:1px solid var(--light-gray)}
.menu-items-list{padding:0 28px}
.menu-item-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--light-gray);transition:background .1s}
.menu-item-row:last-child{border-bottom:none}
.mir-left{flex:1}
.mir-name{font-size:0.9rem;font-weight:500;color:var(--black);margin-bottom:3px;display:flex;align-items:center;gap:7px}
.mir-desc{font-size:0.73rem;color:var(--gray);line-height:1.5}
.mir-badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.badge-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.badge-dot.veg{background:#22c55e}
.badge-dot.vegan{background:#16a34a}
.badge-tag{font-size:0.58rem;letter-spacing:0.5px;text-transform:uppercase;color:var(--gray);background:var(--paper);padding:2px 7px;border-radius:2px}
.mir-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:85px}
.mir-price{font-size:0.88rem;font-weight:500;color:var(--black)}
.add-btn{background:var(--white);color:var(--black);border:1px solid var(--black);padding:6px 16px;font-size:0.72rem;letter-spacing:1px;text-transform:uppercase;font-weight:500;transition:all .15s}
.add-btn:hover{background:var(--black);color:var(--white)}

/* ── CART PANEL ── */
.cart-panel{background:var(--white);border-left:1px solid var(--light-gray);display:flex;flex-direction:column;overflow:hidden}
.cart-head{padding:20px 22px;border-bottom:1px solid var(--light-gray);display:flex;justify-content:space-between;align-items:center}
.cart-head h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400}
.cart-count-badge{background:var(--black);color:var(--white);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:600}
.cart-body{flex:1;overflow-y:auto;padding:8px 0}
.cart-empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;gap:8px;color:var(--mid-gray);text-align:center}
.cart-empty-icon{font-size:2rem;margin-bottom:4px}
.cart-empty-text{font-size:0.8rem;letter-spacing:0.5px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid var(--light-gray)}
.ci-name{font-size:0.82rem;font-weight:500;color:var(--black);margin-bottom:2px}
.ci-price{font-size:0.72rem;color:var(--gray)}
.ci-qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-btn{width:22px;height:22px;border:1px solid var(--light-gray);background:var(--white);color:var(--ink);font-size:0.8rem;display:flex;align-items:center;justify-content:center;transition:all .1s}
.qty-btn:hover{background:var(--black);color:var(--white);border-color:var(--black)}
.qty-num{font-size:0.82rem;min-width:14px;text-align:center;color:var(--black)}
.cart-foot{padding:16px 22px;border-top:1px solid var(--light-gray)}
.cart-total-row{display:flex;justify-content:space-between;margin-bottom:12px;font-size:0.85rem}
.cart-total-row span:last-child{font-weight:600;color:var(--black)}

/* ORDER FORM */
.order-form{padding:16px 22px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}
.of-label{font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray);display:block;margin-bottom:5px}
.of-input{width:100%;background:var(--off-white);border:1px solid var(--light-gray);padding:9px 12px;font-size:0.82rem;color:var(--ink);outline:none;transition:border .15s}
.of-input:focus{border-color:var(--black)}
.of-select{width:100%;background:var(--off-white);border:1px solid var(--light-gray);padding:9px 12px;font-size:0.82rem;color:var(--ink);outline:none;appearance:none;cursor:pointer}
.of-select:focus{border-color:var(--black)}
.of-textarea{width:100%;background:var(--off-white);border:1px solid var(--light-gray);padding:9px 12px;font-size:0.82rem;color:var(--ink);outline:none;resize:none;min-height:60px;line-height:1.5}
.of-textarea:focus{border-color:var(--black)}
.of-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diet-options{display:flex;flex-wrap:wrap;gap:6px}
.diet-opt{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--gray);padding:5px 10px;border:1px solid var(--light-gray);cursor:pointer;transition:all .15s;background:var(--white)}
.diet-opt:hover{border-color:var(--dark-gray);color:var(--ink)}
.diet-opt input{accent-color:var(--black)}
.order-submit-btn{width:100%;background:var(--black);color:var(--white);border:none;padding:14px;font-size:0.75rem;letter-spacing:2px;text-transform:uppercase;font-weight:500;transition:all .15s;margin-top:4px;cursor:pointer}
.order-submit-btn:hover:not(:disabled){background:var(--ink)}
.order-submit-btn:disabled{background:var(--light-gray);color:var(--mid-gray);cursor:not-allowed}
.order-back-btn{background:none;border:none;font-size:0.72rem;color:var(--gray);letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:6px 0;text-align:left}
.order-back-btn:hover{color:var(--black)}

/* ORDER SUCCESS */
.order-success{padding:40px 22px;text-align:center}
.os-icon{font-size:2.5rem;margin-bottom:16px}
.os-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:400;color:var(--black);margin-bottom:8px}
.os-sub{font-size:0.8rem;color:var(--gray);line-height:1.7;margin-bottom:16px}
.os-id{font-family:'Jost',sans-serif;font-size:0.8rem;background:var(--paper);padding:8px 16px;color:var(--black);display:inline-block;margin:8px 0;letter-spacing:2px;border:1px solid var(--light-gray)}
.os-btn{margin-top:16px;padding:12px 28px;background:var(--black);color:var(--white);border:none;font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer}

/* ── CHAT ── */
.chat-wrap{display:flex;flex-direction:column;height:100vh;background:var(--white)}
.chat-topbar{padding:16px 28px;border-bottom:1px solid var(--light-gray);display:flex;align-items:center;gap:12px;background:var(--white)}
.chat-topbar-logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;letter-spacing:2px}
.chat-topbar-sub{font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-left:auto}
.chat-messages{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:16px;background:var(--off-white)}
.chat-msg{display:flex;gap:10px;max-width:680px}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.75rem;margin-top:2px;border:1px solid var(--light-gray);background:var(--white);color:var(--ink)}
.chat-msg.user .msg-avatar{background:var(--black);color:var(--white);border-color:var(--black)}

.msg-bubble{padding:12px 16px;font-size:0.85rem;line-height:1.65;color:var(--ink)}
.chat-msg.user .msg-bubble{background:var(--black);color:var(--white)}
.chat-msg.bot .msg-bubble{background:var(--white);border:1px solid var(--light-gray)}
.msg-time{font-size:0.62rem;color:var(--mid-gray);margin-top:4px;padding:0 2px}
.chat-msg.user .msg-time{text-align:right}
.chat-dish-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chat-dish-card{background:var(--white);border:1px solid var(--light-gray);padding:12px 14px;min-width:160px;max-width:190px;transition:border-color .15s}
.chat-dish-card:hover{border-color:var(--dark-gray)}
.cdc-name{font-size:0.82rem;font-weight:500;color:var(--black);margin-bottom:2px;line-height:1.3}
.cdc-price{font-size:0.75rem;color:var(--gray);margin-bottom:8px}
.cdc-add{width:100%;background:var(--white);border:1px solid var(--black);color:var(--black);font-size:0.65rem;letter-spacing:1.5px;text-transform:uppercase;padding:6px;cursor:pointer;transition:all .15s;font-family:'Jost',sans-serif;font-weight:500}
.cdc-add:hover{background:var(--black);color:var(--white)}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chat-sug{background:var(--white);border:1px solid var(--light-gray);padding:7px 14px;font-size:0.72rem;cursor:pointer;color:var(--gray);letter-spacing:0.3px;transition:all .15s}
.chat-sug:hover{border-color:var(--black);color:var(--black)}
.typing-indicator{display:flex;gap:4px;padding:8px 0}
.typing-indicator span{width:5px;height:5px;background:var(--mid-gray);border-radius:50%;animation:tdot .9s ease-in-out infinite}
.typing-indicator span:nth-child(2){animation-delay:.15s}
.typing-indicator span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.chat-input-area{padding:18px 28px;border-top:1px solid var(--light-gray);background:var(--white)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-textarea{flex:1;background:var(--off-white);border:1px solid var(--light-gray);padding:12px 16px;font-size:0.85rem;color:var(--ink);outline:none;resize:none;min-height:46px;max-height:120px;line-height:1.5;transition:border .15s;font-family:'Jost',sans-serif}
.chat-textarea:focus{border-color:var(--black)}
.chat-send-btn{background:var(--black);color:var(--white);border:none;padding:12px 20px;font-size:0.75rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:500;transition:background .15s;cursor:pointer;white-space:nowrap}
.chat-send-btn:hover:not(:disabled){background:var(--ink)}
.chat-send-btn:disabled{background:var(--light-gray);color:var(--mid-gray);cursor:not-allowed}
.voice-btn{background:var(--white);border:1px solid var(--light-gray);color:var(--gray);padding:12px 14px;font-size:1rem;transition:all .15s;cursor:pointer}
.voice-btn:hover{border-color:var(--black);color:var(--black)}
.voice-btn.listening{background:var(--black);color:var(--white);border-color:var(--black);animation:pulse-voice .8s ease-in-out infinite}
@keyframes pulse-voice{0%,100%{opacity:1}50%{opacity:0.6}}
.chat-hint{font-size:0.65rem;color:var(--mid-gray);margin-top:8px;letter-spacing:0.3px}

/* WELCOME SCREEN */
.chat-welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px;text-align:center}
.cw-logo{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;letter-spacing:6px;color:var(--black);margin-bottom:6px}
.cw-sub{font-size:0.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--gray);margin-bottom:32px}
.cw-greeting{font-size:0.95rem;color:var(--dark-gray);max-width:420px;line-height:1.7;margin-bottom:28px}
.cw-suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:500px}

/* ── ADMIN ── */
.admin-wrap{display:flex;height:100vh;overflow:hidden;background:var(--off-white)}
.admin-sidebar{width:220px;min-width:220px;background:var(--white);border-right:1px solid var(--light-gray);display:flex;flex-direction:column}
.admin-logo{padding:28px 24px 20px;border-bottom:1px solid var(--light-gray)}
.admin-logo h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;letter-spacing:3px;color:var(--black)}
.admin-logo span{font-size:0.58rem;letter-spacing:3px;text-transform:uppercase;color:var(--gray);display:block;margin-top:2px}
.admin-nav{flex:1;padding:8px 0}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:11px 24px;cursor:pointer;font-size:0.8rem;color:var(--gray);letter-spacing:0.3px;transition:all .15s;border-left:2px solid transparent}
.admin-nav-item:hover{color:var(--ink);background:var(--off-white)}
.admin-nav-item.active{color:var(--black);border-left:2px solid var(--black);background:var(--off-white);font-weight:500}
.admin-foot{padding:16px 24px;border-top:1px solid var(--light-gray);font-size:0.68rem;color:var(--mid-gray)}
.admin-main{flex:1;overflow-y:auto}
.admin-login{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--off-white)}
.login-card{background:var(--white);border:1px solid var(--light-gray);padding:48px;width:360px;text-align:center}
.login-card h2{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;letter-spacing:3px;color:var(--black);margin-bottom:4px}
.login-card p{font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:36px}
.login-input{width:100%;background:var(--off-white);border:1px solid var(--light-gray);padding:13px;font-size:0.85rem;color:var(--ink);outline:none;text-align:center;margin-bottom:12px;transition:border .15s}

/* ADMIN CONTENT */
.sec-pad{padding:32px 36px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.sec-head h2{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:var(--black)}
.sec-head p{font-size:0.72rem;color:var(--gray);margin-top:3px;letter-spacing:0.5px}
.tbl-wrap{background:var(--white);border:1px solid var(--light-gray);overflow:hidden}
.data-tbl{width:100%;border-collapse:collapse;font-size:0.8rem}
.data-tbl th{padding:11px 16px;text-align:left;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray);border-bottom:1px solid var(--light-gray);font-weight:500;background:var(--off-white)}

.data-tbl tr:last-child td{border-bottom:none}

.status-badge{display:inline-flex;padding:3px 9px;font-size:0.62rem;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.status-badge.pending{background:#fef9c3;color:#854d0e}
.status-badge.preparing{background:#dbeafe;color:#1e40af}
.status-badge.ready{background:#dcfce7;color:#166534}
.status-badge.completed{background:#f0fdf4;color:#15803d}
.status-badge.cancelled{background:#fee2e2;color:#991b1b}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.form-group.full{grid-column:1/-1}
.f-label{font-size:0.62px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);font-size:0.62rem}
.f-input,.f-select{background:var(--off-white);border:1px solid var(--light-gray);padding:9px 12px;font-size:0.82rem;color:var(--ink);outline:none;transition:border .15s;font-family:'Jost',sans-serif}

.f-textarea{background:var(--off-white);border:1px solid var(--light-gray);padding:9px 12px;font-size:0.82rem;color:var(--ink);outline:none;resize:vertical;min-height:70px;width:100%;transition:border .15s;font-family:'Jost',sans-serif}

/* BUTTONS */

.btn-black{background:var(--black);color:var(--white)}
.btn-black:hover{background:var(--ink)}
.btn-outline{background:var(--white);color:var(--black);border:1px solid var(--black)}

.btn-ghost{background:var(--white);color:var(--gray);border:1px solid var(--light-gray)}
.btn-ghost:hover{border-color:var(--dark-gray);color:var(--ink)}
.btn-danger{background:var(--white);color:#c00;border:1px solid #ffccc7}

.btn-sm{padding:6px 12px;font-size:0.65rem}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--white);border:1px solid var(--light-gray);padding:32px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-box h3{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;margin-bottom:20px;color:var(--black)}

/* ANALYTICS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-box{background:var(--white);border:1px solid var(--light-gray);padding:20px}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;color:var(--black)}
.stat-lbl{font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-top:4px}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.an-panel{background:var(--white);border:1px solid var(--light-gray);padding:20px}
.an-title{font-size:0.6rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--gray);margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-lbl{font-size:0.73rem;color:var(--dark-gray);width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--paper);height:6px}
.bar-fill{height:100%;background:var(--black);transition:width .8s ease}
.bar-val{font-size:0.68rem;color:var(--gray);min-width:24px;text-align:right}
.hour-bars{display:flex;align-items:flex-end;gap:2px;height:70px;margin-bottom:6px}
.h-bar{flex:1;background:var(--paper);border-top:1px solid var(--light-gray);position:relative;min-width:0;cursor:default;transition:background .15s}
.h-bar:hover{background:var(--black)}
.h-bar:hover .h-tip{display:block}
.h-tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--black);color:var(--white);font-size:0.6rem;padding:3px 7px;white-space:nowrap;margin-bottom:4px;z-index:5}
.hour-xlabels{display:flex;gap:2px;font-size:0.52rem;color:var(--mid-gray)}
.hour-xlabel{flex:1;text-align:center;overflow:hidden}
.pref-tags{display:flex;flex-wrap:wrap;gap:8px}
.pref-tag{background:var(--off-white);border:1px solid var(--light-gray);padding:5px 12px;font-size:0.72rem;color:var(--dark-gray);display:flex;align-items:center;gap:6px}
.pref-tag strong{color:var(--black)}

/* TABS */
.filter-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--light-gray)}
.f-tab{padding:9px 16px;font-size:0.65rem;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;color:var(--gray);border-bottom:2px solid transparent;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Jost',sans-serif;font-weight:500}
.f-tab:hover{color:var(--ink)}
.f-tab.active{color:var(--black);border-bottom:2px solid var(--black)}

/* MISC */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--mid-gray);gap:10px;font-size:0.8rem;letter-spacing:1px;text-transform:uppercase}
.spin{width:14px;height:14px;border:1.5px solid var(--light-gray);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px;color:var(--mid-gray);font-size:0.8rem;letter-spacing:1px;text-transform:uppercase}
.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:999}
.toast{background:var(--black);color:var(--white);padding:11px 20px;font-size:0.78rem;letter-spacing:0.5px;animation:toast-in .25s ease;display:flex;align-items:center;gap:8px}
@keyframes toast-in{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── MOBILE RESPONSIVE ── */
@media (max-width: 600px) {
  .splash-hero-content{padding:24px 16px}
  .splash-logo-box{padding:12px 18px}
  .splash-logo{height:60px}
  .splash-btns{flex-direction:column;align-items:center}
  .splash-btn{width:100%;max-width:280px;text-align:center}

}

  .seating-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── PAYPAL ── */
.paypal-section{padding:12px 0 4px}
.paypal-divider{display:flex;align-items:center;gap:10px;margin:10px 0;color:var(--mid-gray);font-size:0.65rem;letter-spacing:1px;text-transform:uppercase}
.paypal-divider::before,.paypal-divider::after{content:'';flex:1;height:1px;background:var(--light-gray)}

/* ── TABLE QR CODES ── */
.table-qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.table-qr-card{background:var(--white);border:1px solid var(--light-gray);padding:20px;text-align:center;cursor:pointer;transition:border-color .15s}
.table-qr-card:hover{border-color:var(--black)}
.table-qr-card .tq-label{font-family:'Cormorant Garamond',serif;font-size:1.1rem;margin-bottom:8px;color:var(--black)}
.table-qr-card .tq-url{font-size:0.55rem;color:var(--mid-gray);margin-top:8px;word-break:break-all;letter-spacing:0.3px}
.print-all-btn{margin-top:16px}
@media print{
  .admin-sidebar,.sec-head .btn-row,button,.admin-foot{display:none!important}
  .table-qr-grid{grid-template-columns:repeat(3,1fr)!important}

}

<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useCallback } = React;
const API = 'http://localhost:5555/api';

async function api(path, opts={}, token='') {
  const h = {'Content-Type':'application/json'};
  if (token) h['X-Admin-Token'] = token;
  const r = await fetch(`${API}${path}`, {...opts, headers:{...h,...(opts.headers||{})}});
  if (!r.ok) { const e = await r.json().catch(()=>({error:'Error'})); throw new Error(e.error||'Failed'); }
  return r.json();
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg) => {
    const id = Date.now();
    setToasts(p=>[...p, {id, msg}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)), 3000);
  }, []);
  return {toasts, add};
}

function Toasts({toasts}) {
  return <div className="toast-stack">{toasts.map(t=><div key={t.id} className="toast">✓ {t.msg}</div>)}</div>;
}

function useCart() {
  const [items, setItems] = useState([]);
  const add = (item) => setItems(p=>{
    const ex = p.find(i=>i.id===item.id);
    return ex ? p.map(i=>i.id===item.id?{...i,quantity:i.quantity+1}:i) : [...p,{...item,quantity:1}];
  });
  const remove = (id) => setItems(p=>p.map(i=>i.id===id?{...i,quantity:i.quantity-1}:i).filter(i=>i.quantity>0));
  const clear = () => setItems([]);
  const total = items.reduce((s,i)=>s+i.price*i.quantity,0);
  const count = items.reduce((s,i)=>s+i.quantity,0);
  return {items, add, remove, clear, total, count};
}

// ── VENUE PICKER ──
function VenuePicker({onSelect}) {
  const [venues, setVenues] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(()=>{ api('/venues').then(setVenues).finally(()=>setLoading(false)); },[]);
  const typeIcons = {restaurant:'🍽', cafe:'☕', hotel:'🏨', other:'🏪'};
  if (loading) return <div className="loading"><div className="spin"/>Loading</div>;
  return (
    <div className="venue-pick-wrap">
      <h2 className="venue-pick-title">Where would you like to order from?</h2>
      <p className="venue-pick-sub">Select a venue to continue</p>
      <div className="venue-grid">
        {venues.map(v=>(
          <div key={v.id} className="venue-card" onClick={()=>onSelect(v)}>
            <div className="vc-type">{typeIcons[v.type]||'🏪'} {v.type}</div>
            <div className="vc-name">{v.name}</div>
            <div className="vc-desc">{v.description}</div>
            {v.address && <div className="vc-addr">📍 {v.address}</div>}
            <div className="vc-arrow">→</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── MENU PAGE ──
function MenuPage({venue, cart, toast, onBack, directTable}) {
  const [menu, setMenu] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeCat, setActiveCat] = useState('');
  const [view, setView] = useState('browse'); // browse | order | success
  const [orderResult, setOrderResult] = useState(null);
  const [prefs, setPrefs] = useState({customer_name:'', order_type:'dine-in', spice_level:'medium', portion_size:'regular', dietary_pref:[], special_instructions:'', table_ref: directTable || ''});
  const [placing, setPlacing] = useState(false);
  const sectionRefs = useRef({});

  // Bestseller & recommended item sets (by name)
  const BESTSELLERS = new Set(['Cappuccino','Cafe Latte','Flat White','Aosa Croissant','Chocolate Croissant','Vietnamese Iced','Cold Brew Classic','Korean Bun 2.0','New York Cheesecake','Eggs Ben-Addict','Tiramisu Tub','Biscoff Cheesecake','Signature Aosa Sourdough','Aosa OMG Cookie','Salted Caramel Popcorn Latte']);
  const RECOMMENDED = new Set(['Coffee Tonic','Aosa Coffee Tonic','Espresso Martini','Mille-Feuille','Shakshuka','Pesto Paneer','Mezze Platter','Pistachio Crusted Chicken','South Indian Filter','Affogato','Buckwheat Pancakes','Dream Come Blue','Chocolate Pistachio Cube']);
  const MUST_TRY = new Set(['Vietnamese Hot','Korean Bun','Lemon Vanilla Cube','Queen of Tarts','Smoked Chicken','Lamb Pepperoni']);

  useEffect(()=>{
    api(`/venues/${venue.id}/menu`).then(d=>{setMenu(d); if(d[0]) setActiveCat(d[0].category);}).finally(()=>setLoading(false));
  },[venue.id]);

  const scrollTocat = (cat) => {
    setActiveCat(cat);
    sectionRefs.current[cat]?.scrollIntoView({behavior:'smooth', block:'start'});
  };

  const placeOrder = async(paypalOrderId=null) => {
    if (!cart.items.length) return;
    setPlacing(true);
    try {
      const res = await api(`/venues/${venue.id}/orders`, {method:'POST', body:JSON.stringify({
        ...prefs, items: cart.items.map(i=>({id:i.id, quantity:i.quantity})),
        ...(paypalOrderId ? {paypal_order_id: paypalOrderId} : {})
      })});
      cart.clear();
      setOrderResult(res);
      setView('success');
      toast('Order placed successfully!');
    } catch(e) { toast(e.message); }
    setPlacing(false);
  };

  const handlePayPal = async() => {
    if (!cart.items.length) return;
    setPlacing(true);
    try {
      // Convert INR to USD roughly (PayPal sandbox uses USD)
      const amountUSD = (cart.total / 83).toFixed(2);
      const createRes = await api('/paypal/create-order', {method:'POST', body:JSON.stringify({amount: amountUSD, currency:'USD'})});
      if (!createRes.id) { toast('PayPal error: ' + (createRes.error || 'Could not create order')); setPlacing(false); return; }
      // Open PayPal approve URL
      const approveLink = createRes.links?.find(l=>l.rel==='approve');
      if (!approveLink) { toast('PayPal: no approval link'); setPlacing(false); return; }
      const ppWin = window.open(approveLink.href, '_blank', 'width=600,height=700');
      // Poll for window close
      const pollTimer = setInterval(async() => {
        if (ppWin && ppWin.closed) {
          clearInterval(pollTimer);
          // Capture the order
          try {
            const captureRes = await api(`/paypal/capture-order/${createRes.id}`, {method:'POST'});
            if (captureRes.status === 'COMPLETED') {
              await placeOrder(createRes.id);
            } else {
              toast('PayPal payment not completed'); setPlacing(false);
            }
          } catch(e) { toast('PayPal capture error'); setPlacing(false); }
        }
      }, 1000);
    } catch(e) {
      toast('PayPal error: ' + e.message);
      setPlacing(false);
    }
  };

  // Auto-capitalize first letter of name
  const handleNameChange = (e) => {
    const val = e.target.value;
    const capitalized = val.charAt(0).toUpperCase() + val.slice(1);
    setPrefs({...prefs, customer_name: capitalized});
  };

  if (view==='success') return (
    <div style={{flex:1,display:'flex',flexDirection:'column'}}>
      <div className="menu-top-bar">
        <button className="btn btn-ghost btn-sm" onClick={onBack}>← Back</button>
        <span className="menu-venue-name">{venue.name}</span>
      </div>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div className="order-success" style={{maxWidth:400}}>
          <div className="os-icon">✓</div>
          <div className="os-title">Order Placed</div>
          <p className="os-sub">Your order is being prepared with care.<br/>Thank you for choosing aosa.</p>
          <div className="os-id">#{orderResult?.order_id?.slice(0,8).toUpperCase()}</div>
          <p style={{fontSize:'0.82rem',color:'var(--gray)',marginTop:8}}>Total: <strong>₹{orderResult?.total?.toFixed(0)}</strong></p>
          <button className="os-btn" onClick={()=>{setView('browse');onBack();}}>Order Again</button>
        </div>
      </div>
    </div>
  );

  return (
    <div className="menu-layout">
      <div className="menu-left">
        <div className="menu-top-bar">
          <button className="btn btn-ghost btn-sm" onClick={onBack}>← Back</button>
          <span className="menu-venue-name">{venue.name}</span>
          {directTable && (
            <span style={{marginLeft:'auto',fontSize:'0.65rem',letterSpacing:'1px',textTransform:'uppercase',color:'#166534',background:'#f0fdf4',border:'1px solid #bbf7d0',padding:'4px 10px'}}>
              📍 {directTable}
            </span>
          )}
        </div>
        {!loading && (
          <div className="menu-cat-tabs">
            {menu.map(cat=>(
              <div key={cat.category} className={`cat-tab ${activeCat===cat.category?'active':''}`} onClick={()=>scrollTocat(cat.category)}>
                {cat.category}
              </div>
            ))}
          </div>
        )}
        {loading ? <div className="loading"><div className="spin"/>Loading menu</div> :
          menu.map(cat=>(
            <div key={cat.category} className="menu-section" ref={el=>sectionRefs.current[cat.category]=el}>
              <div className="menu-section-title">{cat.category}</div>
              <div className="menu-items-list">
                {cat.items.map(item=>(
                  <div key={item.id} className="menu-item-row">
                    <div className="mir-left">
                      <div className="mir-name" style={{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap'}}>

// ── CHAT PAGE ──
function ChatPage({venue, cart, toast}) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [sessionId] = useState(()=>Math.random().toString(36).slice(2));
  const [customerName, setCustomerName] = useState('');
  const [listening, setListening] = useState(false);
  const bottomRef = useRef(null);
  const recognitionRef = useRef(null);

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[messages]);

  // Voice recognition setup
  const startVoice = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Voice not supported in this browser'); return; }
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = 'en-IN';
    rec.onstart = () => setListening(true);
    rec.onresult = (e) => {
      const transcript = Array.from(e.results).map(r=>r[0].transcript).join('');
      setInput(transcript);
    };
    rec.onend = () => { setListening(false); };
    rec.onerror = () => { setListening(false); toast('Voice error — try again'); };
    recognitionRef.current = rec;
    rec.start();
  };

  const stopVoice = () => {
    recognitionRef.current?.stop();
    setListening(false);
  };

  const send = async(msg) => {
    const q = msg || input.trim();
    if (!q || loading) return;
    setInput('');
    setMessages(p=>[...p,{role:'user',content:q,time:new Date()}]);
    setLoading(true);
    try {
      const r = await api(`/venues/${venue.id}/chat`,{method:'POST',body:JSON.stringify({
        message:q, session_id:sessionId, customer_name:customerName
      })});
      setMessages(p=>[...p,{role:'assistant',content:r.reply,dishes:r.suggested_dishes,time:new Date()}]);
    } catch(e) {
      setMessages(p=>[...p,{role:'assistant',content:"Sorry, I'm having a little trouble right now. Could you try again?",time:new Date()}]);
    }
    setLoading(false);
  };

  const suggestions = [
    "What's your best coffee?",
    "Something sweet for dessert",
    "Vegetarian options?",
    "Recommend a croissant",
    "I need something light",
    "What's popular here?",
  ];

  const fmt = (d) => d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

  return (
    <div className="chat-wrap">
      <div className="chat-topbar">
        <span style={{fontSize:'0.8rem',fontFamily:"'Cormorant Garamond',serif",letterSpacing:3}}>aosa</span>
        <span style={{fontSize:'0.65rem',color:'var(--mid-gray)',marginLeft:8}}>Chat with Mia</span>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10}}>
          <input
            style={{background:'var(--off-white)',border:'1px solid var(--light-gray)',padding:'7px 12px',fontSize:'0.75rem',outline:'none',width:160,fontFamily:"'Jost',sans-serif",color:'var(--ink)'}}
            placeholder="Your name (optional)"
            value={customerName}
            onChange={e=>{
              const v = e.target.value;
              setCustomerName(v.charAt(0).toUpperCase()+v.slice(1));
            }}
          />
        </div>
      </div>

      <div className="chat-messages">
        {messages.length===0 && (
          <div className="chat-welcome">
            <div className="cw-logo">aosa</div>
            <div className="cw-sub">Bakehouse & Roastery</div>
            <p className="cw-greeting">
              Hi{customerName?` ${customerName}`:''}! I'm Mia, your guide to everything on our menu. Whether you're after the perfect coffee, a fresh croissant, or something hearty — I'll help you find it.
            </p>
            <div className="cw-suggestions">
              {suggestions.map(s=><div key={s} className="chat-sug" onClick={()=>send(s)}>{s}</div>)}
            </div>
          </div>
        )}
        {messages.map((m,i)=>(
          <div key={i} className={`chat-msg ${m.role==='user'?'user':'bot'}`}>
            <div className="msg-avatar">{m.role==='user'?(customerName?customerName[0].toUpperCase():'U'):'M'}</div>
            <div className="msg-content">
              <div className="msg-bubble" style={{whiteSpace:'pre-wrap'}}>{m.content}</div>
              {m.dishes && m.dishes.length>0 && (
                <div className="chat-dish-row">
                  {m.dishes.map(d=>(
                    <div key={d.id} className="chat-dish-card">
                      <div className="cdc-name">{d.name}</div>
                      <div className="cdc-price">₹{d.price.toFixed(0)}</div>
                      <button className="cdc-add" onClick={()=>{ cart.add(d); toast(`${d.name} added`); }}>Add to order</button>
                    </div>
                  ))}
                </div>
              )}
              <div className="msg-time">{fmt(m.time)}</div>
            </div>
          </div>
        ))}
        {loading && (
          <div className="chat-msg bot">
            <div className="msg-avatar">M</div>
            <div className="msg-bubble"><div className="typing-indicator"><span/><span/><span/></div></div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      <div className="chat-input-area">
        <div className="chat-input-row">
          <button
            className={`voice-btn ${listening?'listening':''}`}
            onClick={listening?stopVoice:startVoice}
            title={listening?'Stop listening':'Voice input'}
          >
            {listening ? '⏹' : '🎤'}
          </button>
          <textarea
            className="chat-textarea"
            value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&(e.preventDefault(),send())}
            placeholder={listening?'Listening…':'Ask about the menu, get recommendations…'}
            rows={1}
          />
          <button className="chat-send-btn" onClick={()=>send()} disabled={loading||!input.trim()}>
            Send
          </button>
        </div>
        <div className="chat-hint">
          {listening ? '🔴 Listening — speak now, then click stop' : 'Enter to send · Shift+Enter for new line · 🎤 for voice'}
        </div>
      </div>
    </div>
  );
}

  const submit = async()=>{
    setLoading(true); setErr('');

    catch(e){ setErr('Incorrect password'); }
    setLoading(false);
  };
  return (
    <div className="admin-login" style={{position:'relative'}}>
      <button onClick={onBack} style={{position:'absolute',top:24,left:24,background:'none',border:'1px solid var(--light-gray)',padding:'8px 16px',fontSize:'0.7rem',letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--gray)',cursor:'pointer',fontFamily:"'Jost',sans-serif",transition:'all .15s'}}
        onMouseOver={e=>{e.target.style.borderColor='var(--black)';e.target.style.color='var(--black)'}}
        onMouseOut={e=>{e.target.style.borderColor='var(--light-gray)';e.target.style.color='var(--gray)'}}>

function TableQRManager({ venueId, venueName, token, toast }) {
  const [tables, setTables] = useState([]);
  const [loading, setLoading] = useState(false);
  const [count, setCount] = useState('');
  const [prefix, setPrefix] = useState('Table');
  const [adding, setAdding] = useState(false);
  const [newLabel, setNewLabel] = useState('');
  const qrRefs = useRef({});
  const baseUrl = window.location.origin + window.location.pathname;

  const loadTables = useCallback(() => {
    setLoading(true);
    api(`/admin/venues/${venueId}/tables`, {}, token).then(setTables).finally(() => setLoading(false));
  }, [venueId, token]);

  useEffect(() => { loadTables(); }, [loadTables]);

  // Render QR codes after tables load
  useEffect(() => {
    tables.forEach(t => {
      const el = document.getElementById(`qr-${t.id}`);
      if (el && !el.dataset.rendered) {
        el.dataset.rendered = '1';
        el.innerHTML = '';
        new QRCode(el, {
          text: `${baseUrl}?venue=${venueId}&table=${encodeURIComponent(t.label)}`,
          width: 140, height: 140,
          colorDark: '#0d0d0d', colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H,
        });
      }
    });
  }, [tables]);

  const bulkCreate = async () => {
    const n = parseInt(count);
    if (!n || n < 1) return;
    try {
      const result = await api(`/admin/venues/${venueId}/tables/bulk`, {
        method: 'POST',
        body: JSON.stringify({ count: n, prefix: prefix.trim() || 'Table' })
      }, token);
      toast(`Created ${result.length} table QR codes`);
      loadTables();
    } catch(e) { toast(e.message); }
  };

  const addSingle = async () => {
    if (!newLabel.trim()) return;
    try {
      await api(`/admin/venues/${venueId}/tables`, {
        method: 'POST', body: JSON.stringify({ label: newLabel.trim() })
      }, token);
      toast(`Added ${newLabel}`);
      setNewLabel(''); setAdding(false);
      loadTables();
    } catch(e) { toast(e.message); }
  };

  const deleteTable = async (tid, label) => {
    if (!confirm(`Delete QR for "${label}"?`)) return;
    try {
      await api(`/admin/tables/${tid}`, { method: 'DELETE' }, token);
      toast(`Deleted ${label}`);
      loadTables();
    } catch(e) { toast(e.message); }
  };

  const printAll = () => window.print();

  return (
    <div style={{marginTop:32,borderTop:'1px solid var(--light-gray)',paddingTop:24}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,marginBottom:16}}>
        <div>
          <div style={{fontSize:'0.6rem',letterSpacing:'2.5px',textTransform:'uppercase',color:'var(--black)',fontWeight:600,marginBottom:2}}>
            Table QR Codes
          </div>
          <div style={{fontSize:'0.7rem',color:'var(--gray)'}}>
            Customers scan these to jump directly to {venueName}'s menu
          </div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          {tables.length > 0 && (
            <button className="btn btn-ghost btn-sm" onClick={printAll}>🖨 Print All</button>
          )}
          <button className="btn btn-ghost btn-sm" onClick={()=>setAdding(!adding)}>+ Add One</button>
        </div>
      </div>

      {/* Bulk generator */}
      <div style={{background:'var(--paper)',border:'1px solid var(--light-gray)',padding:'14px 16px',marginBottom:16,display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          <label style={{fontSize:'0.6rem',letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--gray)'}}>Prefix</label>
          <input className="f-input" style={{width:100}} value={prefix} onChange={e=>setPrefix(e.target.value)} placeholder="Table"/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          <label style={{fontSize:'0.6rem',letterSpacing:'1.5px',textTransform:'uppercase',color:'var(--gray)'}}>Number of Tables</label>
          <input type="number" min="1" max="100" className="f-input" style={{width:80}} value={count} onChange={e=>setCount(e.target.value)} placeholder="e.g. 20"/>
        </div>
        <button className="btn btn-black" style={{height:38}} onClick={bulkCreate} disabled={!count}>
          Generate QR Codes
        </button>
        <div style={{fontSize:'0.65rem',color:'var(--mid-gray)',alignSelf:'center'}}>
          Replaces existing tables for this venue
        </div>
      </div>

      {/* Add single table */}
      {adding && (
        <div style={{background:'var(--white)',border:'1px solid var(--light-gray)',padding:'12px 14px',marginBottom:12,display:'flex',gap:8,alignItems:'center'}}>
          <input className="f-input" style={{flex:1}} value={newLabel} onChange={e=>setNewLabel(e.target.value)}
            placeholder="e.g. Bar Seat 1, Terrace A, Counter 3…"
            onKeyDown={e=>e.key==='Enter'&&addSingle()}/>
          <button className="btn btn-black btn-sm" onClick={addSingle} disabled={!newLabel.trim()}>Add</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setAdding(false);setNewLabel('');}}>Cancel</button>
        </div>
      )}

      {/* QR grid */}
      {loading ? <div className="loading"><div className="spin"/>Loading tables…</div> :
        tables.length === 0 ? (
          <div className="empty" style={{padding:'30px 0'}}>No tables yet — generate QR codes above</div>
        ) : (
          <div className="table-qr-grid">
            {tables.map(t => {
              const qrUrl = `${baseUrl}?venue=${venueId}&table=${encodeURIComponent(t.label)}`;
              return (
                <div key={t.id} className="table-qr-card">
                  <div className="tq-label">{t.label}</div>
                  <div id={`qr-${t.id}`} style={{display:'inline-block',margin:'0 auto'}}/>
                  <div className="tq-url">{qrUrl}</div>
                  <button
                    className="btn btn-danger btn-sm"
                    style={{marginTop:10,fontSize:'0.58rem'}}
                    onClick={()=>deleteTable(t.id, t.label)}
                  >Delete</button>
                </div>
              );
            })}
          </div>
        )
      }
    </div>
  );
}

function AdminMenu({token, toast}) {
  const [venues, setVenues] = useState([]);
  const [sel, setSel] = useState('');
  const [cats, setCats] = useState([]);
  const [items, setItems] = useState([]);
  const [modal, setModal] = useState(false);
  const [editModal, setEditModal] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({name:'',description:'',price:'',category_id:'',is_veg:false,is_vegan:false,tags:''});
  const [editForm, setEditForm] = useState({name:'',description:'',price:'',category_id:'',is_veg:false,is_vegan:false,tags:'',is_available:true});

  useEffect(()=>{ api('/admin/venues',{},token).then(d=>{setVenues(d);if(d[0])setSel(d[0].id);}); },[token]);
  useEffect(()=>{
    if(!sel)return;
    api(`/admin/venues/${sel}/categories`,{},token).then(setCats);
    api(`/admin/venues/${sel}/items`,{},token).then(setItems);
  },[sel,token]);

  const reloadItems = ()=> api(`/admin/venues/${sel}/items`,{},token).then(setItems);

  const openEdit = (item) => {
    setEditItem(item);
    setEditForm({
      name: item.name,
      description: item.description || '',
      price: item.price.toString(),
      category_id: item.category_id || '',
      is_veg: !!item.is_veg,
      is_vegan: !!item.is_vegan,
      tags: Array.isArray(item.tags) ? item.tags.join(', ') : '',
      is_available: !!item.is_available,
    });
    setEditModal(true);
  };

  const saveEdit = async()=>{
    const tags = editForm.tags ? editForm.tags.split(',').map(t=>t.trim()).filter(Boolean) : [];
    try {
      await api(`/admin/items/${editItem.id}`,{method:'PUT',body:JSON.stringify({
        name: editForm.name,
        description: editForm.description,
        price: parseFloat(editForm.price),
        category_id: editForm.category_id,
        is_veg: editForm.is_veg ? 1 : 0,
        is_vegan: editForm.is_vegan ? 1 : 0,
        is_available: editForm.is_available ? 1 : 0,
        tags,
      })},token);
      toast('Item updated'); setEditModal(false); setEditItem(null); reloadItems();
    } catch(e){ toast(e.message); }
  };

  const addCat = async()=>{
    const n=prompt('Category name:'); if(!n)return;
    await api(`/admin/venues/${sel}/categories`,{method:'POST',body:JSON.stringify({name:n})},token);
    api(`/admin/venues/${sel}/categories`,{},token).then(setCats);
    toast('Category added');
  };
  const delCat = async(id)=>{ await api(`/admin/categories/${id}`,{method:'DELETE'},token); api(`/admin/venues/${sel}/categories`,{},token).then(setCats); reloadItems(); toast('Deleted'); };
  const saveItem = async()=>{
    const tags = form.tags?form.tags.split(',').map(t=>t.trim()).filter(Boolean):[];
    try {
      await api(`/admin/venues/${sel}/items`,{method:'POST',body:JSON.stringify({...form,tags,is_veg:form.is_veg?1:0,is_vegan:form.is_vegan?1:0,price:parseFloat(form.price)})},token);
      toast('Item added'); setModal(false); setForm({name:'',description:'',price:'',category_id:'',is_veg:false,is_vegan:false,tags:''}); reloadItems();
    } catch(e){toast(e.message);}
  };
  const delItem = async(id)=>{ await api(`/admin/items/${id}`,{method:'DELETE'},token); setItems(p=>p.filter(i=>i.id!==id)); toast('Item removed'); };
  const toggleAvail = async(item)=>{ await api(`/admin/items/${item.id}`,{method:'PUT',body:JSON.stringify({...item,tags:Array.isArray(item.tags)?item.tags:[],is_available:item.is_available?0:1})},token); reloadItems(); };

  const grouped = cats.map(c=>({...c,items:items.filter(i=>i.category_id===c.id)}));

  return (
    <div className="sec-pad">
      <div className="sec-head">
        <div><h2>Menu Manager</h2><p>Add and manage menu items per venue</p></div>
        <div className="btn-row">
          <select className="f-select" style={{minWidth:180}} value={sel} onChange={e=>setSel(e.target.value)}>
            {venues.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
          </select>
          <button className="btn btn-ghost" onClick={addCat}>+ Category</button>
          <button className="btn btn-black" onClick={()=>setModal(true)}>+ Add Item</button>
        </div>
      </div>
      {grouped.map(cat=>(
        <div key={cat.id} style={{marginBottom:24}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,paddingBottom:8,borderBottom:'1px solid var(--light-gray)'}}>
            <span style={{fontSize:'0.75rem',fontWeight:500,letterSpacing:'1px',textTransform:'uppercase',color:'var(--black)'}}>{cat.name}</span>
            <span style={{fontSize:'0.68rem',color:'var(--mid-gray)'}}>({cat.items.length})</span>
            <button className="btn btn-danger btn-sm" style={{marginLeft:'auto'}} onClick={()=>delCat(cat.id)}>Delete category</button>
          </div>
          <div className="tbl-wrap">
            <table className="data-tbl">
              <thead><tr><th>Name</th><th>Description</th><th>Price</th><th>Diet</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                {cat.items.length===0?<tr><td colSpan={6} style={{textAlign:'center',padding:'20px',color:'var(--mid-gray)',fontSize:'0.75rem'}}>No items</td></tr>:
                  cat.items.map(item=>(
                    <tr key={item.id}>
                      <td style={{color:'var(--black)',fontWeight:500}}>{item.name}</td>
                      <td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--gray)'}}>{item.description||'—'}</td>
                      <td style={{fontWeight:500}}>₹{item.price.toFixed(0)}</td>
                      <td>{item.is_vegan?<span style={{fontSize:'0.62rem',color:'#166534',background:'#dcfce7',padding:'2px 7px'}}>Vegan</span>:item.is_veg?<span style={{fontSize:'0.62rem',color:'#14532d',background:'#f0fdf4',padding:'2px 7px'}}>Veg</span>:'—'}</td>

                      <td><div className="btn-row">
                        <button className="btn btn-outline btn-sm" onClick={()=>openEdit(item)}>Edit</button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>toggleAvail(item)}>{item.is_available?'Hide':'Show'}</button>
                        <button className="btn btn-danger btn-sm" onClick={()=>delItem(item.id)}>Del</button>
                      </div></td>
                    </tr>
                  ))
                }
              </tbody>
            </table>
          </div>
        </div>
      ))}

      {/* ADD ITEM MODAL */}

          <div className="form-group"><label className="f-label">Price (₹) *</label><input type="number" step="1" className="f-input" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}/></div>
          <div className="form-group"><label className="f-label">Category</label>
            <select className="f-select" value={form.category_id} onChange={e=>setForm({...form,category_id:e.target.value})}>
              <option value="">No category</option>
              {cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div className="form-group full"><label className="f-label">Description</label><textarea className="f-textarea" value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Describe the item…"/></div>

            <label className="f-check"><input type="checkbox" checked={form.is_veg} onChange={e=>setForm({...form,is_veg:e.target.checked})}/>Vegetarian</label>

          <div className="form-group">
            <label className="f-label">Category</label>
            <select className="f-select" value={editForm.category_id} onChange={e=>setEditForm({...editForm,category_id:e.target.value})}>

              {cats.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}

          </div>
          <div className="form-group full">
            <label className="f-label">Description</label>
            <textarea className="f-textarea" value={editForm.description} onChange={e=>setEditForm({...editForm,description:e.target.value})} placeholder="Describe the item…"/>

          <div className="form-group full">
            <label className="f-label">Tags (comma-separated)</label>
            <input className="f-input" value={editForm.tags} onChange={e=>setEditForm({...editForm,tags:e.target.value})} placeholder="spicy, sweet, vegan…"/>
          </div>
          <div className="form-group" style={{flexDirection:'row',alignItems:'center',gap:20,paddingTop:6,gridColumn:'1/-1',flexWrap:'wrap'}}>
            <label className="f-check"><input type="checkbox" checked={editForm.is_veg} onChange={e=>setEditForm({...editForm,is_veg:e.target.checked})}/>Vegetarian</label>
            <label className="f-check"><input type="checkbox" checked={editForm.is_vegan} onChange={e=>setEditForm({...editForm,is_vegan:e.target.checked})}/>Vegan</label>
            <label className="f-check"><input type="checkbox" checked={editForm.is_available} onChange={e=>setEditForm({...editForm,is_available:e.target.checked})}/>Available (visible to customers)</label>
          </div>
        </div>
        <div style={{background:'var(--paper)',border:'1px solid var(--light-gray)',padding:'10px 14px',marginTop:8,fontSize:'0.72rem',color:'var(--gray)'}}>
          <strong style={{color:'var(--dark-gray)'}}>Current:</strong> ₹{editItem.price.toFixed(0)} · {editItem.name}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={()=>{setEditModal(false);setEditItem(null);}}>Cancel</button>
          <button className="btn btn-black" onClick={saveEdit} disabled={!editForm.name||!editForm.price}>Save Changes</button>
        </div>
      </div></div>}
    </div>
  );
}

function AdminOrders({token, toast}) {
  const [venues, setVenues] = useState([]);
  const [sel, setSel] = useState('');
  const [orders, setOrders] = useState([]);
  const [filter, setFilter] = useState('');
  const [loading, setLoading] = useState(false);
  useEffect(()=>{ api('/admin/venues',{},token).then(d=>{setVenues(d);if(d[0])setSel(d[0].id);}); },[token]);
  const load = useCallback(()=>{
    if(!sel)return;
    setLoading(true);
    api(`/admin/venues/${sel}/orders${filter?`?status=${filter}`:''}`,{},token).then(setOrders).finally(()=>setLoading(false));
  },[sel,filter,token]);
  useEffect(()=>{ load(); const t=setInterval(load,15000); return()=>clearInterval(t); },[load]);
  const updateStatus = async(oid,status)=>{ await api(`/admin/orders/${oid}/status`,{method:'PUT',body:JSON.stringify({status})},token); toast(`Marked as ${status}`); load(); };
  const next = {pending:['preparing','cancelled'],preparing:['ready','cancelled'],ready:['completed'],completed:[],cancelled:[]};

  return (
    <div className="sec-pad">
      <div className="sec-head">
        <div><h2>Live Orders</h2><p>Refreshes every 15 seconds</p></div>
        <div className="btn-row">
          <select className="f-select" value={sel} onChange={e=>setSel(e.target.value)}>
            {venues.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
          </select>
          <button className="btn btn-ghost btn-sm" onClick={load}>↻</button>
        </div>
      </div>
      <div className="filter-tabs">
        {['','pending','preparing','ready','completed','cancelled'].map(s=>(
          <button key={s} className={`f-tab ${filter===s?'active':''}`} onClick={()=>setFilter(s)}>{s||'All'}</button>
        ))}
      </div>
      {loading ? <div className="loading"><div className="spin"/>Loading</div> :
        orders.length===0 ? <div className="empty">No orders found</div> : (
        <div className="tbl-wrap">
          <table className="data-tbl">
            <thead><tr><th>Order</th><th>Customer</th><th>Type</th><th>Items</th><th>Preferences</th><th>Total</th><th>Time</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>
              {orders.map(o=>(
                <tr key={o.id}>
                  <td style={{fontFamily:'monospace',fontSize:'0.72rem',letterSpacing:'1px'}}>{o.id.slice(0,8).toUpperCase()}</td>
                  <td>{o.customer_name||'Guest'}{o.table_ref&&<span style={{color:'var(--gray)',fontSize:'0.7rem'}}> · {o.table_ref}</span>}</td>
                  <td style={{fontSize:'0.73rem'}}>{o.order_type==='dine-in'?'Dine In':'Takeaway'}</td>
                  <td style={{fontSize:'0.72rem',maxWidth:160,color:'var(--dark-gray)'}}>{o.items.map(i=>`${i.name}×${i.quantity}`).join(', ')}</td>
                  <td style={{fontSize:'0.7rem'}}>
                    <div style={{color:'var(--gray)'}}>{o.spice_level} · {o.portion_size}</div>
                    {o.dietary_pref.length>0&&<div style={{color:'var(--gray)'}}>{o.dietary_pref.join(', ')}</div>}
                    {o.special_instructions&&<div style={{color:'var(--mid-gray)',fontStyle:'italic',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={o.special_instructions}>"{o.special_instructions}"</div>}
                  </td>
                  <td style={{fontWeight:500}}>₹{o.total_amount?.toFixed(0)}</td>
                  <td style={{fontSize:'0.7rem',color:'var(--gray)'}}>{o.created_at?.slice(11,16)}</td>
                  <td><span className={`status-badge ${o.status}`}>{o.status}</span></td>
                  <td><div className="btn-row">{next[o.status]?.map(s=><button key={s} className="btn btn-ghost btn-sm" style={{fontSize:'0.62rem'}} onClick={()=>updateStatus(o.id,s)}>{s}</button>)}</div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function AdminAnalytics({token}) {
  const [venues, setVenues] = useState([]);
  const [sel, setSel] = useState('');
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [fromDate, setFromDate] = useState('');
  const [toDate, setToDate] = useState('');
  useEffect(()=>{ api('/admin/venues',{},token).then(d=>{setVenues(d);if(d[0])setSel(d[0].id);}); },[token]);
  
  const loadAnalytics = useCallback(() => {
    if(!sel) return;
    setLoading(true);
    let qs = '';
    if(fromDate) qs += `&from_date=${fromDate}`;
    if(toDate) qs += `&to_date=${toDate}`;
    api(`/admin/venues/${sel}/analytics?t=1${qs}`,{},token).then(setData).finally(()=>setLoading(false));
  }, [sel, fromDate, toDate, token]);

  useEffect(()=>{ loadAnalytics(); },[loadAnalytics]);

  const hours = Array.from({length:24},(_,i)=>i);
  const maxH = data?Math.max(...hours.map(h=>{const r=data.hourly.find(x=>x.hour_of_day===h);return r?r.count:0}),1):1;
  const maxI = data?Math.max(...data.top_items.map(i=>i.qty),1):1;

  return (
    <div className="sec-pad">
      <div className="sec-head">
        <div><h2>Analytics</h2><p>Customer behaviour & order insights</p></div>
        <select className="f-select" value={sel} onChange={e=>setSel(e.target.value)}>
          {venues.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
        </select>
      </div>

      {/* DATE FILTER */}
      <div style={{background:'var(--white)',border:'1px solid var(--light-gray)',padding:'16px 20px',marginBottom:20,display:'flex',flexWrap:'wrap',gap:12,alignItems:'flex-end'}}>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          <label style={{fontSize:'0.6rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gray)'}}>From Date</label>
          <input type="date" className="f-input" style={{minWidth:160}} value={fromDate} onChange={e=>setFromDate(e.target.value)}/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          <label style={{fontSize:'0.6rem',letterSpacing:'2px',textTransform:'uppercase',color:'var(--gray)'}}>To Date</label>
          <input type="date" className="f-input" style={{minWidth:160}} value={toDate} onChange={e=>setToDate(e.target.value)}/>
        </div>
        <button className="btn btn-black" onClick={loadAnalytics} style={{height:38}}>Apply Filter</button>
        {(fromDate||toDate) && (
          <button className="btn btn-ghost" onClick={()=>{setFromDate('');setToDate('');}} style={{height:38}}>Clear</button>
        )}
        {(fromDate||toDate) && (
          <span style={{fontSize:'0.72rem',color:'var(--gray)',alignSelf:'center'}}>
            {fromDate && toDate ? `${fromDate} → ${toDate}` : fromDate ? `From ${fromDate}` : `Until ${toDate}`}
          </span>
        )}
      </div>

      {loading?<div className="loading"><div className="spin"/>Loading</div>:!data?null:(
        <>
          <div className="stat-grid">
            {[['Total Orders',data.stats.total_orders||0],['Pending',data.stats.pending||0],['Preparing',data.stats.preparing||0],['Avg Order','₹'+(data.stats.avg_order_value||0)],['Revenue','₹'+(data.stats.total_revenue||0)]].map(([l,v])=>(
              <div key={l} className="stat-box"><div className="stat-val">{v}</div><div className="stat-lbl">{l}</div></div>
            ))}
          </div>

          <div className="an-panel" style={{marginBottom:16}}>
            <div className="an-title">Peak Order Times — Hour of Day</div>
            <div className="hour-bars">
              {hours.map(h=>{
                const row=data.hourly.find(x=>x.hour_of_day===h);
                const cnt=row?row.count:0;
                const pct=Math.round((cnt/maxH)*100);
                const lbl=h===0?'12am':h<12?`${h}am`:h===12?'12pm':`${h-12}pm`;
                return <div key={h} className="h-bar" style={{height:`${Math.max(pct,2)}%`}}><div className="h-tip">{lbl}: {cnt}</div></div>;
              })}
            </div>
            <div className="hour-xlabels">
              {hours.map(h=><div key={h} className="hour-xlabel">{h===0?'12a':h===6?'6a':h===12?'12p':h===18?'6p':''}</div>)}
            </div>
          </div>

          <div className="analytics-grid">
            <div className="an-panel">
              <div className="an-title">Most Ordered Items</div>
              {data.top_items.map(item=>(
                <div key={item.name} className="bar-row">
                  <div className="bar-lbl" title={item.name}>{item.name}</div>
                  <div className="bar-track"><div className="bar-fill" style={{width:`${(item.qty/maxI)*100}%`}}/></div>
                  <div className="bar-val">{item.qty}</div>
                </div>
              ))}
            </div>
            <div className="an-panel">
              <div className="an-title">Orders by Day</div>
              {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(day=>{
                const row=data.day_of_week.find(d=>d.day_of_week===day);
                const cnt=row?row.count:0;
                const max=Math.max(...data.day_of_week.map(d=>d.count),1);
                return <div key={day} className="bar-row"><div className="bar-lbl">{day}</div><div className="bar-track"><div className="bar-fill" style={{width:`${(cnt/max)*100}%`}}/></div><div className="bar-val">{cnt}</div></div>;
              })}
            </div>
            <div className="an-panel">
              <div className="an-title">Spice Preference</div>
              <div className="pref-tags">
                {[{l:'Mild',v:'mild'},{l:'Medium',v:'medium'},{l:'Hot',v:'hot'},{l:'Extra Hot',v:'extra-hot'}].map(s=>{
                  const row=data.spice_prefs.find(r=>r.spice_level===s.v);
                  return <div key={s.v} className="pref-tag">{s.l} <strong>{row?row.count:0}</strong></div>;
                })}
              </div>
              <div className="an-title" style={{marginTop:14}}>Order Type</div>
              <div className="pref-tags">
                {data.order_types.map(t=><div key={t.order_type} className="pref-tag">{t.order_type==='dine-in'?'Dine In':'Takeaway'} <strong>{t.count}</strong></div>)}
              </div>
            </div>
            <div className="an-panel">
              <div className="an-title">Dietary Preferences</div>
              {data.dietary_prefs.length===0?<div style={{fontSize:'0.75rem',color:'var(--mid-gray)'}}>No data yet</div>:
                <div className="pref-tags">{data.dietary_prefs.map(([l,c])=><div key={l} className="pref-tag">{l} <strong>{c}</strong></div>)}</div>}
              <div className="an-title" style={{marginTop:14}}>Portion Size</div>
              <div className="pref-tags">
                {data.portion_prefs.map(p=><div key={p.portion_size} className="pref-tag">{p.portion_size} <strong>{p.count}</strong></div>)}
              </div>
            </div>
          </div>
        </>
      )}

      {/* NLP TECHNIQUES PANEL - Admin Only */}
      <div style={{marginTop:40,borderTop:'2px solid var(--black)',paddingTop:32}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20}}>
          <div style={{fontSize:'0.62rem',letterSpacing:'3px',textTransform:'uppercase',color:'var(--black)',fontWeight:600}}>◈ NLP Engine Status</div>
          <div style={{fontSize:'0.65rem',color:'var(--mid-gray)'}}>Techniques powering Mia's intelligence</div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:8,marginBottom:16}}>
          {[
            {name:'Text Normalisation',active:true,desc:'Lowercases input, strips punctuation & trims whitespace before processing.'},
            {name:'Tokenization',active:true,desc:'Splits each message into individual word tokens for per-word analysis.'},
            {name:'TF-IDF Vectorization',active:true,desc:'Converts item names, descriptions & tags into weighted numerical vectors.'},
            {name:'Cosine Similarity',active:true,desc:'Scores menu items by how close their vectors are to the query — powers recommendations.'},
            {name:'N-gram Analysis',active:true,desc:'Captures 1-word & 2-word phrases (e.g. "cold brew", "flat white") for better matching.'},
            {name:'Retrieval-based Q&A',active:true,desc:'Finds relevant dishes from the menu knowledge base in response to natural questions.'},
            {name:'Chatbot & Virtual Assistance',active:true,desc:'Mia uses Gemini 2.0 Flash — a large language model maintaining full conversation context.'},
            {name:'Named Entity Recognition',active:true,desc:'Identifies food names, dietary terms (vegan, GF) and price mentions in messages.'},
            {name:'Dependency Parsing',active:'partial',desc:'LLM internally parses sentence structure — understands "spicy but not too heavy".'},
            {name:'Word Sense Disambiguation',active:'partial',desc:'Resolves ambiguity: "light" → food portion vs light coffee roast, based on context.'},
            {name:'Emotion Determining',active:'partial',desc:'Gemini reads mood cues — "I\'m exhausted" nudges it toward comfort food picks.'},
            {name:'Opinion Mining',active:'partial',desc:'Picks up sentiment like "didn\'t enjoy spicy last time" to refine suggestions.'},
            {name:'Spam Detection',active:false,desc:'Not implemented — messages are not screened for spam in the current version.'},
            {name:'Machine Translation',active:false,desc:'Not implemented — English only. Multi-language support is a planned future feature.'},
          ].map(t=>(
            <div key={t.name} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'10px 12px',border:`1px solid ${t.active===true?'#bbf7d0':t.active==='partial'?'#fde68a':'var(--light-gray)'}`,background:t.active===true?'#f0fdf4':t.active==='partial'?'#fffbeb':'var(--off-white)'}}>
              <div style={{width:8,height:8,borderRadius:'50%',flexShrink:0,marginTop:5,background:t.active===true?'#16a34a':t.active==='partial'?'#d97706':'#d1d5db'}}/>
              <div>
                <div style={{fontSize:'0.75rem',fontWeight:600,color:'var(--black)',marginBottom:2}}>
                  {t.name}
                  <span style={{marginLeft:8,fontSize:'0.58rem',letterSpacing:'1px',textTransform:'uppercase',fontWeight:400,color:t.active===true?'#16a34a':t.active==='partial'?'#d97706':'#9ca3af'}}>
                    {t.active===true?'● Active':t.active==='partial'?'◐ Partial (via LLM)':'○ Not used'}
                  </span>
                </div>
                <div style={{fontSize:'0.7rem',color:'var(--gray)',lineHeight:1.5}}>{t.desc}</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{fontSize:'0.65rem',color:'var(--mid-gray)',padding:'10px 12px',background:'var(--paper)',border:'1px solid var(--light-gray)'}}>
          ● Active — built into the Python backend &nbsp;|&nbsp; ◐ Partial — handled internally by the LLM &nbsp;|&nbsp; ○ Not used — planned for future versions
        </div>
      </div>
    </div>
  );
}

        {page==='analytics' && <AdminAnalytics token={token}/>}
      </div>
      <Toasts toasts={toasts}/>
    </div>
  );
}
